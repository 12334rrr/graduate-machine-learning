/* ---- 柱状图（分组对比，对标 Grafana Bar chart） ---- */
/* 与折线图同样按容器宽度重绘：RESP[id] 保存 render(w)，ResizeObserver 统一驱动 */
const RESP = {};
function gbar(cats, series, opt) {
  opt = opt || {};
  const id = "gb" + (++chartSeq);
  const item = { width: 720, render: w => gbarSVG(cats, series, opt, w) };
  RESP[id] = item;
  return '<div class="gchart" data-resp="' + id + '">' + item.render(720) + "</div>";
}
/* 分类标签宽度估计（px）：CJK 字符按 1.0×字号、ASCII 按 0.56×字号 */
function labelW(s, fs) {
  let wpx = 0;
  for (const ch of String(s)) wpx += /[^\x00-\xff]/.test(ch) ? fs : fs * 0.56;
  return wpx;
}
/* 分类标签防重叠布局决策（gbar 专用）：
 *   n ≤ 5        → 竖排柱状图（水平标签）；
 *   6 ≤ n ≤ 10   → 总宽放得下就水平，放不下旋转 −35°；
 *   n > 10       → 转横向条形图（分类轴纵向，标签永不相交）。
 * 硬性要求：任何模式下字号 ≥10px，不为避让缩小字号——宁可旋转/转横向。 */
function fitBarCats(cats, availW, fs) {
  fs = fs || 10.5;
  const n = cats.length;
  if (n <= 5) return "v";
  if (n > 10) return "h";
  const total = cats.reduce((s, c) => s + labelW(c, fs), 0) + (n - 1) * 8;
  return total > availW ? "r" : "v";
}
function gbarSVG(cats, series, opt, w) {
  const layout = fitBarCats(cats, w - 56 - 18, 10.5);
  if (layout === "h") return gbarH(cats, series, opt, w);
  const pal = seriesColors();
  const rot = layout === "r";
  const h = opt.h || 240, pl = 56, pr = 18, pt = 22, pb = rot ? 62 : 46;
  series.forEach((s, i) => { if (!s.color) s.color = pal[i % pal.length]; });
  const all = [].concat.apply([], series.map(s => s.values));
  if (!all.length) return '<div class="empty" style="padding:24px"><div class="emoji">📊</div>暂无数据</div>';
  let y0 = 0, y1 = Math.max.apply(null, all);
  /* 误差线上端不能超出 y 轴 */
  series.forEach(s => (s.errors || []).forEach((e, i) => {
    if (typeof e === "number" && typeof s.values[i] === "number") y1 = Math.max(y1, s.values[i] + e);
  }));
  if (opt.yMax != null) y1 = Math.max(y1, opt.yMax);
  if (y1 <= 0) y1 = 1;
  y1 *= 1.14;
  const Y = v => pt + (1 - (v - y0) / (y1 - y0)) * (h - pt - pb);
  const bandW = (w - pl - pr) / Math.max(1, cats.length);
  const barW = Math.min(38, bandW * 0.68 / series.length);
  const tk = niceTicks(y0, y1, 4);
  let grid = "";
  tk.ticks.forEach(v => {
    if (v < y0 || v > y1) return;
    const yy = Y(v).toFixed(1);
    grid += '<line x1="' + pl + '" y1="' + yy + '" x2="' + (w - pr) + '" y2="' + yy + '" style="stroke:var(--chart-grid)"/>';
    grid += '<text class="c-tick" x="' + (pl - 9) + '" y="' + (Number(yy) + 4) + '" text-anchor="end">' + fmtNum(v, tk.step) + "</text>";
  });
  let bars = "";
  cats.forEach((c, ci) => {
    const cx = pl + bandW * ci + bandW / 2;
    const groupW = barW * series.length + 3 * (series.length - 1);
    series.forEach((s, si) => {
      const v = s.values[ci];
      if (v == null || isNaN(v)) return;
      const bx = cx - groupW / 2 + si * (barW + 3);
      const by = Y(v), bh = Math.max(1, h - pb - by);
      bars += '<rect x="' + bx.toFixed(1) + '" y="' + by.toFixed(1) + '" width="' + barW.toFixed(1) +
        '" height="' + bh.toFixed(1) + '" rx="2.5" fill="' + s.color + '"><title>' + esc(c) + " · " + esc(s.name) +
        " = " + (opt.fmt ? opt.fmt(v) : v.toFixed(3)) + "</title></rect>";
      /* 误差线（如 3 种子样本标准差） */
      const err = s.errors && s.errors[ci];
      if (typeof err === "number" && err > 0) {
        const ex = bx + barW / 2;
        const eTop = Math.max(pt, Y(v + err)), eBot = Math.min(h - pb, Y(Math.max(0, v - err)));
        const cap = Math.max(2.5, Math.min(6, barW / 4));
        bars += '<line x1="' + ex.toFixed(1) + '" y1="' + eTop.toFixed(1) + '" x2="' + ex.toFixed(1) + '" y2="' + eBot.toFixed(1) +
          '" style="stroke:var(--text2)" stroke-width="1.2"/>' +
          '<line x1="' + (ex - cap).toFixed(1) + '" y1="' + eTop.toFixed(1) + '" x2="' + (ex + cap).toFixed(1) + '" y2="' + eTop.toFixed(1) +
          '" style="stroke:var(--text2)" stroke-width="1.2"/>' +
          '<line x1="' + (ex - cap).toFixed(1) + '" y1="' + eBot.toFixed(1) + '" x2="' + (ex + cap).toFixed(1) + '" y2="' + eBot.toFixed(1) +
          '" style="stroke:var(--text2)" stroke-width="1.2"/>';
      }
      if (barW >= 20) {
        /* 有误差线时数值标签抬到误差线上端帽之上，避免被竖线穿过 */
        const lblY = (typeof err === "number" && err > 0) ? Math.max(pt + 9, Y(v + err) - 5) : by - 4;
        bars += '<text class="c-tick" x="' + (bx + barW / 2).toFixed(1) + '" y="' + lblY.toFixed(1) +
          '" text-anchor="middle" style="fill:var(--text)">' + (opt.fmt ? opt.fmt(v) : v.toFixed(3)) + "</text>";
      }
    });
    /* 分类标签：放不下时旋转 −35°（锚点在刻度右上，文字向左下延伸），不为避让缩字号 */
    if (rot) {
      const lx = (cx + 4).toFixed(1), ly = h - pb + 14;
      bars += '<text class="c-tick" x="' + lx + '" y="' + ly + '" text-anchor="end" transform="rotate(-35 ' + lx + " " + ly + ')" style="fill:var(--text2)">' + esc(c) + "</text>";
    } else {
      bars += '<text class="c-tick" x="' + cx.toFixed(1) + '" y="' + (h - pb + 18) + '" text-anchor="middle" style="fill:var(--text2)">' + esc(c) + "</text>";
    }
  });
  const legend = series.map((s, i) =>
    '<span class="lg" style="cursor:default"><span class="dot" style="background:' + s.color + '"></span>' + esc(s.name) + "</span>").join("");
  const errNote = series.some(s => s.errors && s.errors.some(e => typeof e === "number"))
    ? '<span class="lg" style="cursor:default;opacity:.75">误差线＝多种子样本标准差</span>' : "";
  const xLab = opt.xLabel ? '<text class="c-axlabel" x="' + (w - pr) + '" y="' + (h - 2) + '" text-anchor="end">' + esc(opt.xLabel) + "</text>" : "";
  return '<div class="chart-legend">' + legend + errNote + "</div>" +
    '<svg class="gc-svg" viewBox="0 0 ' + w + " " + h + '" preserveAspectRatio="xMidYMid meet" style="width:100%;height:' + h + 'px;display:block">' + grid +
    '<line x1="' + pl + '" y1="' + (h - pb) + '" x2="' + (w - pr) + '" y2="' + (h - pb) + '" style="stroke:var(--chart-axis)"/>' +
    bars + xLab + "</svg>";
}
/* 横向条形图（分类 >10 时自动启用）：分类标签右对齐排在轴左，永不相交；
 * 条按首序列数值降序排列，数值轴在底部，tooltip/误差线/图例与竖排模式同一套逻辑。 */
function gbarH(cats, series, opt, w) {
  const pal = seriesColors();
  series.forEach((s, i) => { if (!s.color) s.color = pal[i % pal.length]; });
  const all = [].concat.apply([], series.map(s => s.values));
  if (!all.length) return '<div class="empty" style="padding:24px"><div class="emoji">📊</div>暂无数据</div>';
  const fs = 10.5, n = cats.length, ns = series.length;
  /* 排序：按首序列数值降序（缺失排最后），长列表更易扫读 */
  const order = cats.map((c, i) => i).sort((a, b) => {
    const va = series[0].values[a], vb = series[0].values[b];
    return (vb == null ? -Infinity : vb) - (va == null ? -Infinity : va);
  });
  const labW = Math.min(Math.max.apply(null, cats.map(c => labelW(c, fs))) + 12, w * 0.44, 200);
  const pr = 18, pt = 24, pb = 42;
  const plotL = labW + 14, plotR = w - pr, plotW = Math.max(80, plotR - plotL);
  const bandH = Math.max(ns * 13 + 7, 18);
  const h = pt + n * bandH + pb;
  let x1 = Math.max.apply(null, all.filter(v => typeof v === "number" && !isNaN(v)).concat([0]));
  series.forEach(s => (s.errors || []).forEach((e, i) => {
    if (typeof e === "number" && typeof s.values[i] === "number") x1 = Math.max(x1, s.values[i] + e);
  }));
  if (opt.yMax != null) x1 = Math.max(x1, opt.yMax);
  if (x1 <= 0) x1 = 1;
  x1 *= ns === 1 ? 1.22 : 1.1;   /* 单序列时条末要标数值，多留头部空间 */
  const X = v => plotL + v / x1 * plotW;
  const tk = niceTicks(0, x1, 5);
  let grid = "";
  tk.ticks.forEach(v => {
    if (v < 0 || v > x1) return;
    const xx = X(v).toFixed(1);
    grid += '<line x1="' + xx + '" y1="' + pt + '" x2="' + xx + '" y2="' + (h - pb) + '" style="stroke:var(--chart-grid)"/>';
    grid += '<text class="c-tick" x="' + xx + '" y="' + (h - pb + 16) + '" text-anchor="middle">' + fmtNum(v, tk.step) + "</text>";
  });
  const barH = Math.max(8, Math.min(13, (bandH - 6) / ns));
  let bars = "";
  order.forEach((ci, row) => {
    const yTop = pt + row * bandH, cy = yTop + bandH / 2;
    bars += '<text class="c-tick" x="' + labW.toFixed(1) + '" y="' + (cy + 3.5).toFixed(1) +
      '" text-anchor="end" style="fill:var(--text2)">' + esc(cats[ci]) + "</text>";
    series.forEach((s, si) => {
      const v = s.values[ci];
      if (v == null || isNaN(v)) return;
      const yb = yTop + (bandH - ns * barH - (ns - 1) * 2) / 2 + si * (barH + 2);
      const bw = Math.max(1.5, X(v) - plotL);
      bars += '<rect x="' + plotL.toFixed(1) + '" y="' + yb.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + barH.toFixed(1) +
        '" rx="2" fill="' + s.color + '"><title>' + esc(cats[ci]) + " · " + esc(s.name) +
        " = " + (opt.fmt ? opt.fmt(v) : v.toFixed(3)) + "</title></rect>";
      /* 误差线（横向） */
      const err = s.errors && s.errors[ci];
      if (typeof err === "number" && err > 0) {
        const ey = yb + barH / 2;
        const lft = X(Math.max(0, v - err)), rgt = X(v + err);
        const cap = Math.max(2, Math.min(5, barH / 3));
        bars += '<line x1="' + lft.toFixed(1) + '" y1="' + ey.toFixed(1) + '" x2="' + rgt.toFixed(1) + '" y2="' + ey.toFixed(1) + '" style="stroke:var(--text2)" stroke-width="1.1"/>' +
          '<line x1="' + lft.toFixed(1) + '" y1="' + (ey - cap).toFixed(1) + '" x2="' + lft.toFixed(1) + '" y2="' + (ey + cap).toFixed(1) + '" style="stroke:var(--text2)" stroke-width="1.1"/>' +
          '<line x1="' + rgt.toFixed(1) + '" y1="' + (ey - cap).toFixed(1) + '" x2="' + rgt.toFixed(1) + '" y2="' + (ey + cap).toFixed(1) + '" style="stroke:var(--text2)" stroke-width="1.1"/>';
      }
      /* 单序列且条够高时在条末标数值；放不下就画进条内（白字） */
      if (ns === 1 && barH >= 9) {
        const label = opt.fmt ? opt.fmt(v) : v.toFixed(3);
        const lx = plotL + bw + 5;
        const inside = lx + labelW(label, fs) + 4 > plotR;
        bars += '<text class="c-tick" x="' + (inside ? plotL + bw - 5 : lx).toFixed(1) + '" y="' + (yb + barH / 2 + 3.5).toFixed(1) +
          '" text-anchor="' + (inside ? "end" : "start") + '" style="fill:' + (inside ? "#fff" : "var(--text)") + '">' + esc(label) + "</text>";
      }
    });
  });
  const legend = series.map((s, i) =>
    '<span class="lg" style="cursor:default"><span class="dot" style="background:' + s.color + '"></span>' + esc(s.name) + "</span>").join("");
  const errNote = series.some(s => s.errors && s.errors.some(e => typeof e === "number"))
    ? '<span class="lg" style="cursor:default;opacity:.75">误差线＝多种子样本标准差</span>' : "";
  const xLab = opt.xLabel ? '<text class="c-axlabel" x="' + plotR + '" y="' + (h - 2) + '" text-anchor="end">' + esc(opt.xLabel) + "</text>" : "";
  return '<div class="chart-legend">' + legend + errNote + "</div>" +
    '<svg class="gc-svg" viewBox="0 0 ' + w + " " + h + '" preserveAspectRatio="xMidYMid meet" style="width:100%;height:' + h + 'px;display:block">' + grid +
    '<line x1="' + plotL.toFixed(1) + '" y1="' + pt + '" x2="' + plotL.toFixed(1) + '" y2="' + (h - pb) + '" style="stroke:var(--chart-axis)"/>' +
    '<line x1="' + plotL.toFixed(1) + '" y1="' + (h - pb) + '" x2="' + plotR + '" y2="' + (h - pb) + '" style="stroke:var(--chart-axis)"/>' +
    bars + xLab + "</svg>";
}
/* 容器宽度变化 → 按新宽度重绘（保持 1:1 像素比例，文字/圆点/阈值线不再被拉伸压缩） */
let chartRO = null, roTimer = null;
function resizeChartEl(el, w) {
  if (!w) return;
  if (el.dataset.chart) {
    const st = CHARTS[el.dataset.chart];
    if (!st || Math.abs((st.width || 720) - w) < 2) return;
    st.width = w;
    el.innerHTML = chartSVG(el.dataset.chart);
  } else if (el.dataset.resp) {
    const item = RESP[el.dataset.resp];
    if (!item || Math.abs(item.width - w) < 2) return;
    item.width = w;
    el.innerHTML = item.render(w);
  }
}
function attachChartResize() {
  if (typeof ResizeObserver === "undefined") return;
  if (!chartRO) {
    chartRO = new ResizeObserver(entries => {
      entries.forEach(en => resizeChartEl(en.target, Math.round(en.target.clientWidth)));
    });
  }
  document.querySelectorAll(".gchart").forEach(el => {
    if (el.dataset.ro) return;
    el.dataset.ro = "1";
    chartRO.observe(el);
    /* 立即按当前宽度重绘一次：ResizeObserver 的首帧回调可能晚于本次渲染 */
    resizeChartEl(el, Math.round(el.clientWidth));
  });
  /* 画廊宽图跨两列：图片加载完成后按真实宽高比重估（onload 之外 here 兜底一次） */
  document.querySelectorAll(".gal-item img").forEach(galAspect);
}
if (typeof MutationObserver !== "undefined") {
  new MutationObserver(() => {
    clearTimeout(roTimer);
    roTimer = setTimeout(attachChartResize, 60);
  }).observe(document.body, { childList: true, subtree: true });
}

/* ---- 统计面板（对标 Grafana Stat panel：大数字 + 副标题 + 迷你趋势） ---- */
function gstat(label, value, opt) {
  opt = opt || {};
  const color = opt.color || "var(--text)";
  let spark = "";
  if (opt.spark && opt.spark.length > 1) {
    const pts = opt.spark.filter(v => typeof v === "number" && !isNaN(v));
    if (pts.length > 1) {
      const w = 120, h = 30, lo = Math.min.apply(null, pts), hi = Math.max.apply(null, pts);
      const X = i => (i / (pts.length - 1)) * w;
      const Y = v => h - 2 - (hi === lo ? 0.5 : (v - lo) / (hi - lo)) * (h - 6);
      const P = pts.map((v, i) => [Number(X(i).toFixed(1)), Number(Y(v).toFixed(1))]);
      const c = opt.sparkColor || "var(--primary)";
      spark = '<svg viewBox="0 0 ' + w + " " + h + '" style="width:100%;height:30px;display:block;margin-top:6px">' +
        '<path d="' + smoothPath(P) + " L" + w + "," + h + " L0," + h + ' Z" fill="' + c + '" opacity=".13"/>' +
        '<path d="' + smoothPath(P) + '" fill="none" stroke="' + c + '" stroke-width="1.6" stroke-linecap="round"/></svg>';
    }
  }
  return '<div class="gstat">' +
    '<div class="gs-lab">' + esc(label) + "</div>" +
    '<div class="gs-val" style="color:' + color + (opt.size ? ";font-size:" + opt.size : "") + '">' + esc(String(value)) +
      (opt.unit ? '<span class="gs-unit">' + esc(opt.unit) + "</span>" : "") + "</div>" +
    (opt.sub ? '<div class="gs-sub">' + opt.sub + "</div>" : "") + spark + "</div>";
}
function toPts(rows, xKey, yKey) {
  return (rows || []).map(r => [r[xKey], r[yKey]])
    .filter(p => typeof p[0] === "number" && typeof p[1] === "number");
}
function statusBadge(st) {
  if (st === "finished" || st === "done") return '<span class="badge done">已完成</span>';
  if (st === "running") return '<span class="badge running">运行中</span>';
  return '<span class="badge pending">待运行</span>';
}
function fileRows(files, proj, emptyHint) {
  if (!files || !files.length) return '<div class="muted" style="font-size:13px">' + emptyHint + "</div>";
  return files.map(f =>
    '<div class="file-row"><span class="nm" title="' + esc(f.path) + '">' + esc(f.name) + "</span>" +
      '<span class="dl-meta">' + esc(f.size_h) + " · " + esc(f.mtime) + "</span>" +
      '<a class="btn sm" href="/exp/' + proj + "/download?proj=" + proj + "&path=" + encodeURIComponent(f.path) + '" download>下载</a></div>').join("");
}
async function loadHwReport(proj, path, boxId) {
  const box = document.getElementById(boxId);
  box.style.display = "block";
  box.textContent = "加载中…";
  try {
    const r = await api("/api/hw_report?proj=" + proj + "&path=" + encodeURIComponent(path));
    box.textContent = r.content;
  } catch (e) {
    box.textContent = "加载失败：" + e.message;
  }
}

/* ==================== 弹窗系统（运行详情 / 评测档案 / 源码 / 图片灯箱） ==================== */
function openModal(title, bodyHtml, opt) {
  opt = opt || {};
  let m = document.getElementById("modal");
  if (!m) {
    m = document.createElement("div");
    m.id = "modal";
    m.addEventListener("click", e => { if (e.target === m) closeModal(); });
    document.body.appendChild(m);
  }
  m.className = "modal" + (opt.wide ? " wide" : "");
  m.innerHTML = '<div class="modal-card">' +
    '<div class="modal-head"><b>' + esc(title) + "</b>" +
      '<button class="modal-x" onclick="closeModal()" aria-label="关闭">✕</button></div>' +
    '<div class="modal-body">' + bodyHtml + "</div></div>";
  m.style.display = "flex";
  document.body.style.overflow = "hidden";
}
function closeModal() {
  const m = document.getElementById("modal");
  if (m) { m.style.display = "none"; m.innerHTML = ""; }
  document.body.style.overflow = "";
  FIG_NAV = null;   /* 灯箱关闭后清除上下组导航状态 */
}
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { closeModal(); return; }
  if (!FIG_NAV) return;   /* 灯箱打开时 ←/→ 在同分组内循环切换 */
  if (e.key === "ArrowLeft") { e.preventDefault(); figStep(-1); }
  else if (e.key === "ArrowRight") { e.preventDefault(); figStep(1); }
});

/* 运行详情：指标 + 逐 epoch 曲线 + 原始日志表 */
function showRunDetail(proj, tag) {
  const d = proj === "hw1" ? state.hw1 : state.hw2;
  const r = ((d && d.runs) || []).find(x => x.tag === tag);
  if (!r) return;
  const cols = Object.keys((r.series && r.series[0]) || {});
  const yKey = cols.indexOf("val_dice") >= 0 ? "val_dice" : "dice";
  const chart = (r.series || []).length
    ? gchart([
        { name: metCN(yKey), pts: toPts(r.series, "epoch", yKey) },
        { name: "训练损失", pts: toPts(r.series, "epoch", "train_loss") },
      ], { h: 220, smooth: true, xLabel: "轮次" })

/* 图片灯箱：大图 + 中文标题 + 生成逻辑/作用/路径 + 同组上一条/下一条（U3/U6） */
let FIG_NAV = null;
const FIG_LISTS = {};
let figListSeq = 0;
/* 每次视图渲染把文件列表登记成带 gid 的清单，画廊网格与说明区共用同一份 */
function figList(files, proj) {
  if (!files || !files.length) return [];
  const gid = "fig" + (++figListSeq);
  const list = files.map(f => ({
    name: f.name,

    group: figGroup(f.name),
    note: FIG_NOTES[f.name] || null,
    title: figTitle(f),
  }));
  list.gid = gid;
  FIG_LISTS[gid] = list;
  return list;
}
function figHow(it) { return it.note ? it.note.how : "本图由实验脚本自动生成，详见 reports/ 目录。"; }
function figWhy(it) { return it.note ? it.note.why : "支撑对应实验小节的结论。"; }
function openFig(gid, idx) {
  const list = FIG_LISTS[gid];
  if (!list || !list[idx]) return;
  const it = list[idx];
  const mates = list.map((x, i) => (x.group === it.group ? i : -1)).filter(i => i >= 0);
  const pos = mates.indexOf(idx);
  FIG_NAV = { gid: gid, mates: mates, pos: pos };
  openModal(it.title,
    '<div class="lb-wrap"><img class="lightbox-img" src="' + esc(it.src) + '" alt="' + esc(it.title) + '"></div>' +
    '<div class="lb-cap">' +

        (mates.length > 1 ? '<span class="lb-pos">第 ' + (pos + 1) + " / " + mates.length + " 张（" + esc(it.group) + "）</span>" : "") +
      "</div></div>" +

      '<a class="btn sm" href="' + esc(it.src) + '" target="_blank" rel="noopener">新标签打开原图 ↗</a>' +
      '<a class="btn sm" href="' + esc(it.src) + '" download>下载</a>' +
    "</div>", { wide: true });
}
function figStep(dir) {
  if (!FIG_NAV) return;
  const n = FIG_NAV.mates.length;
  if (!n) return;
  openFig(FIG_NAV.gid, FIG_NAV.mates[(FIG_NAV.pos + dir + n) % n]);
}

/* 图表画廊：缩略图（中文标题 + 文件名两行 caption），点击开灯箱；宽图跨两列（U4d） */
function galAspect(img) {
  if (!img || !img.naturalWidth) return;
  const item = img.closest(".gal-item"), gal = img.closest(".gallery");
  if (!item || !gal) return;
  const ratio = img.naturalWidth / img.naturalHeight;
  item.dataset.ratio = ratio.toFixed(2);
  /* 全部条目都是宽图（如 hw2 四张复合图）时改用两列等宽布局：
   * 每张都「跨两列」会在 auto-fill 网格里留下成片空洞；混排时才逐项跨两列 */
  const items = Array.from(gal.querySelectorAll(".gal-item"));
  const known = items.filter(it => it.dataset.ratio).length;
  const wideCount = items.filter(it => parseFloat(it.dataset.ratio) > 1.6).length;
  if (known === items.length && wideCount === items.length && items.length >= 2 && gal.clientWidth >= 720) {
    gal.classList.add("gal-wide");
    return;
  }
  gal.classList.remove("gal-wide");
  /* 单条目宽图（单图分组）占满整行，避免半宽卡右侧留大片空洞 */
  if (items.length === 1 && ratio > 1.6 && gal.clientWidth >= 720) {
    item.classList.add("span-all");
    return;
  }
  item.classList.remove("span-all");
  /* 宽高比 >1.6 的宽幅图且画廊够宽时跨两列，缩略图不再被 letterbox 压扁 */
  if (ratio > 1.6 && gal.clientWidth >= 720) item.classList.add("span2");
  else item.classList.remove("span2");
}
function figureGallery(list, emptyHint, grouped) {
  if (!list || !list.length) return '<div class="muted" style="font-size:13px">' + emptyHint + "</div>";

    return '<figure class="gal-item" onclick="openFig(\'' + list.gid + "'," + idx + ')" title="点击放大，附生成逻辑与作用说明">' +
      '<img src="' + esc(it.src) + '" loading="lazy" alt="' + esc(it.title) + '" onload="galAspect(this)">' +
      '<figcaption><div class="gal-title">' + esc(it.title) + '</div>' +
        '<div class="gal-name" title="' + esc(it.path) + '">' + esc(it.name) + "</div></figcaption></figure>";
  }).join("") + "</div>";
  if (!grouped) return grid(list);
  const groups = {};
  list.forEach(it => { (groups[it.group] = groups[it.group] || []).push(it); });
  return FIG_GROUP_ORDER.filter(g => groups[g]).map(g =>

  ).join("");
}

/* ==================== 折叠组件（U2） ====================
 * 规则：列表行数 > 8 才折叠（fileRows / 评测表 / 图目录说明区）；
 * 图表卡、统计卡、实时面板、画廊网格一律不加折叠控件。
 * 状态存 sessionStorage（键=卡身份），同会话内切运行 / 自动刷新后恢复。 */
const CLPS_THRESHOLD = 8, CLPS_H = 188;   /* 折叠态可见高度 ≈ 前 5 行 */
function collapsibleBlock(innerHtml, count, opt) {
  opt = opt || {};
  if (count == null || count <= CLPS_THRESHOLD) return innerHtml;
  const key = opt.key || ("x" + count);
  let open = false;
  try { open = sessionStorage.getItem("dh-clps:" + key) === "1"; } catch (e) { /* 隐私模式 */ }
  return '<div class="clps' + (open ? " open" : "") + '" data-clps-key="' + esc(key) + '" data-clps-n="' + count + '">' +
    '<div class="clps-body">' + innerHtml + "</div>" +
    '<div class="clps-fade"></div>' +
    '<button class="clps-toggle" type="button" aria-expanded="' + (open ? "true" : "false") + '">' +
      '<span class="cv">▸</span>' + (open ? "收起" : "展开全部（" + count + "）") + "</button></div>";
}
function setClpsOpen(box, open) {
  const body = box.querySelector(".clps-body");
  if (!body) return;
  const btn = box.querySelector(".clps-toggle");
  const n = box.dataset.clpsN;
  const finish = () => {   /* 展开动画结束后放开高度限制，防内容换行变化被裁 */
    if (box.classList.contains("open")) body.style.maxHeight = "none";
    body.removeEventListener("transitionend", finish);
  };

  if (open) {

    requestAnimationFrame(() => { body.style.maxHeight = CLPS_H + "px"; });

  }

    btn.innerHTML = '<span class="cv">▸</span>' + (open ? "收起" : "展开全部（" + n + "）");
    btn.setAttribute("aria-expanded", open ? "true" : "false");

let pageNav = null;   /* { secs, onScroll } */
function teardownPageNav() {
  if (pageNav && pageNav.onScroll) window.removeEventListener("scroll", pageNav.onScroll);
  pageNav = null;
}
function pageNavSpy() {
  if (!pageNav) return;
  const secs = pageNav.secs;
  let cur = secs[0] && secs[0].id;
  for (const s of secs) {
    const el = document.getElementById(s.id);
    if (el && el.getBoundingClientRect().top <= 96) cur = s.id;
  }
  /* 滚到页底时点亮最后一章（末章较短时也能到达） */
  if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4) {
    cur = secs[secs.length - 1].id;
  }
  const navEl = document.querySelector(".page-nav");
  document.querySelectorAll(".page-nav .pn-item").forEach(b =>
    b.classList.toggle("active", b.dataset.sec === cur));
  const act = document.querySelector(".page-nav .pn-item.active");
  if (act && navEl) {   /* 激活项在侧栏内保持可见（纵向/横向两种形态） */
    const r = act.getBoundingClientRect(), nr = navEl.getBoundingClientRect();
    if (r.top < nr.top + 2) navEl.scrollTop += r.top - nr.top - 6;
    else if (r.bottom > nr.bottom - 2) navEl.scrollTop += r.bottom - nr.bottom + 6;
    if (r.left < nr.left + 2) navEl.scrollLeft += r.left - nr.left - 6;
    else if (r.right > nr.right - 2) navEl.scrollLeft += r.right - nr.right + 6;
  }
}
function initPageNav(mountId, secs) {

  pageNav = { secs: secs, onScroll: null };
  let ticking = false;
  pageNav.onScroll = () => {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(() => { ticking = false; pageNavSpy(); });
  };
  window.addEventListener("scroll", pageNav.onScroll, { passive: true });
  nav.addEventListener("click", e => {
    const b = e.target.closest(".pn-item");

/* ==================== 实时运行面板（3s 轮询 /api/live） ====================
 * 训练/评测进程每 epoch / 每 25 张向 outputs/progress/*.json 写心跳，
 * 这里只更新面板本身，不重绘整个视图（避免打断图表悬停与滚动位置）。 */
let liveTimer = null;
function fmtDur(sec) {
  if (sec == null || isNaN(sec)) return "—";
  sec = Math.max(0, Math.round(sec));
  if (sec < 60) return sec + " 秒";
  const m = Math.round(sec / 60);
  if (m < 60) return m + " 分钟";
  const h = Math.floor(m / 60), r = m % 60;
  return h + " 小时" + (r ? " " + r + " 分钟" : "");
}
function livePct(it) {
  if (it.epoch != null && it.epochs_total) return Math.min(100, it.epoch / it.epochs_total * 100);
  if (it.it != null && it.total) return Math.min(100, it.it / it.total * 100);
  return null;
}
function liveKind(it) {
  if (it.phase === "done") return "已完成";
  return it.phase === "eval" ? "评测中" : "训练中";
}
function liveProgressText(it) {
  if (it.phase === "eval" && it.it != null && it.total) return it.it + " / " + it.total;
  if (it.phase === "train" && it.epoch != null && it.epochs_total) return "epoch " + it.epoch + " / " + it.epochs_total;
  return "";
}
function renderLive(items) {
  if (!items.length) {
    return '<div class="live-empty"><span class="live-dot"></span>本项目当前没有运行中的任务</div>';
  }
  return items.map(it => {
    const pct = livePct(it);
    const done = it.phase === "done";
    const kind = liveKind(it);
    /* 训练按 epoch 写心跳（约 5 分钟一次），阈值放宽；评测每 10 张写一次，150s 无心跳才算异常 */
    const stale = !done && (it.phase === "train" ? it.age_sec > 420 : it.age_sec > 150);
    const age = it.age_sec < 60 ? Math.round(it.age_sec) + "s 前" : Math.round(it.age_sec / 60) + " 分钟前";
    if (stale) {
      return '<div class="live-item stale">' +
        '<div class="live-head"><span class="badge pending">心跳超时</span>' +
        '<b class="mono">' + esc(it.tag || it.stage || "") + "</b>" +
        '<span class="live-age">' + age + "（可能已停止）</span></div>" +
        (it.detail ? '<div class="live-detail">' + esc(it.detail) + "</div>" : "") + "</div>";
    }
    const eta = !done && it.eta_sec != null
      ? '<div class="live-eta">已运行 <b>' + fmtDur(it.elapsed_sec) + "</b>" +
        (it.eta_sec ? " · 预计还需 <b>" + fmtDur(it.eta_sec) + "</b>" : " · 正在收尾") + "</div>"
      : "";
    return '<div class="live-item ' + (done ? "done" : "running") + '">' +
      '<div class="live-head">' +
        '<span class="badge ' + (done ? "done" : "running") + '">' + (done ? "" : '<span class="live-dot"></span>') + kind + "</span>" +
        '<b class="mono">' + esc(it.tag || it.stage || "") + "</b>" +
        (it.stage && it.prompt ? '<span class="tag cat">' + esc(stageCN(it.stage)) + " · " + esc(promptCN(it.prompt)) + "</span>" : "") +
        '<span class="live-age">' + age + (done ? "（完成后保留 10 分钟）" : "") + "</span>" +
      "</div>" +
      (pct != null
        ? '<div class="live-bar"><i style="width:' + pct.toFixed(1) + '%"></i><span>' + pct.toFixed(0) + "%</span></div>"
        : "") +
      (it.detail ? '<div class="live-detail">' + esc(it.detail) + "</div>" : "") +
      eta +
    "</div>";
  }).join("");
}
function renderOtherLive(others) {
  if (!others.length) return "";
  return '<div class="live-other">其他项目也在运行：' + others.map(it =>
    '<a href="#/' + esc(it.proj) + '">' + esc(it.proj) + " · " + esc(it.tag || it.stage || "") +
    " " + esc(liveKind(it)) + (it.eta_sec != null ? " · 预计还需 " + fmtDur(it.eta_sec) : "") +
    "</a>").join("；") + "</div>";
}
async function pollLive() {
  const panel = document.getElementById("live-panel");
  if (!panel) { stopLivePoll(); return; }
  const proj = panel.dataset.proj;
  try {

}

function stopLivePoll() { if (liveTimer) { clearInterval(liveTimer); liveTimer = null; } }

/* 消融面板：只有一组至少 2 个设置时才画对比柱状图；否则诚实展示基线 */
function hw1AblationBars(d) {
  const ab = d.ablation || {};
  const groups = Object.keys(ab);
  if (!groups.length) return '<div class="muted" style="font-size:13px">消融实验尚未运行（<code>run_all.py --only ablation</code>）。</div>';
  const ready = groups.every(g => ab[g] && Object.keys(ab[g]).length >= 2);
  if (!ready) {
    const rows = groups.map(g => {
      const items = ab[g] || {};
      const name = Object.keys(items)[0] || "—";
      const v = items[name] || {};
      const cell = x => (x == null ? "—" : Number(x).toFixed(3));
      return "<tr><td>" + esc(g) + "</td><td class='mono'>" + esc(name) + "</td><td>" + cell(v.dice) +
        "</td><td>" + cell(v.iou) + "</td><td>" + (v.hd95 == null ? "—" : Number(v.hd95).toFixed(1)) + "</td></tr>";
    }).join("");
    return '<div class="muted" style="font-size:12.5px;line-height:1.65;margin-bottom:8px">' +
        '消融实验尚未运行（<code>run_all.py --only ablation</code>），当前仅展示各组<b>基线配置</b>；' +
        '同一维度还没有第二个设置，因此不构成可比较的结论。</div>' +
      '<div class="table-scroll"><table class="stat-table num-table">' +
        '<tr><td style="color:var(--text2)">维度</td><td style="color:var(--text2)">设置</td>' +
        '<td style="color:var(--text2)">Dice</td><td style="color:var(--text2)">IoU</td><td style="color:var(--text2)">HD95</td></tr>' +
        rows + "</table></div>";
  }
  return '<div class="grid grid-3">' + groups.map(g => {
    const items = ab[g] || {};
    const cats = Object.keys(items);
    /* 分辨率组的 HD95 单位随输入尺寸变化，跨设置不可比，故只画 Dice */
    const series = [{ name: "Dice", values: cats.map(c => items[c].dice) }];
    if (!/分辨率/.test(g)) {
      series.push({ name: "HD95(px)（@256）", values: cats.map(c => items[c].hd95) });
    }
    return '<div><div class="muted" style="font-size:12.5px;margin-bottom:4px">' + esc(g) +

      gbar(cats, series, { h: 200, fmt: v => v.toFixed(2) }) + "</div>";
  }).join("") + "</div>";
}
/* ---------- 聚合小工具 ---------- */
function nmean(arr) {
  const v = (arr || []).filter(x => typeof x === "number" && !isNaN(x));
  return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null;
}
/* 样本标准差（ddof=1），与 reports/tables.md 的 ± 口径一致 */
function nstd(arr) {
  const v = (arr || []).filter(x => typeof x === "number" && !isNaN(x));
  if (v.length < 2) return null;
  const m = v.reduce((a, b) => a + b, 0) / v.length;
  return Math.sqrt(v.reduce((s, x) => s + (x - m) * (x - m), 0) / (v.length - 1));
}
/* 运行分组：主对比 / 诊断 / 冒烟 / 消融（消融 tag 为 loss_* / size* / attn_skip 等） */
function runGroup(tag) {
  if (/^diag_/.test(tag)) return "diag";
  if (/^smoke/.test(tag)) return "smoke";
  if (/^cv_/.test(tag)) return "cv";
  if (/^(loss_bce|loss_dice|size\d+|attn_skip|attn_bottleneck)$/.test(tag)) return "ablation";
  if (/^(unet|resunet|attn_unet)_s\d+$/.test(tag)) return "main";
  return "other";
}
function diceCell(v) {
  if (v == null || isNaN(v)) return '<span class="muted">—</span>';
  const cls = v >= 0.8 ? "vt-good" : v >= 0.6 ? "vt-mid" : "vt-bad";
  return '<b class="' + cls + '">' + Number(v).toFixed(4) + "</b>";
}
function hw1AggByModel(evals) {
  const CN = { unet: "U-Net", resunet: "ResUNet", attn_unet: "Attention U-Net" };
  const out = {};
  /* 只聚合主对比运行 {model}_s{seed}：消融评测的 args.model 与主实验相同，混入会污染均值 */
  (evals || []).filter(e => e.metrics && e.split === "test" &&
      /^(unet|resunet|attn_unet)_s\d+$/.test(e.tag || "")).forEach(e => {
    const tag = e.tag || "";
    const k = /^attn/.test(tag) ? "attn_unet" : /^res/.test(tag) ? "resunet" : "unet";
    (out[k] = out[k] || []).push(e);
  });
  return Object.entries(out).map(([k, es]) => ({
    key: k, name: CN[k] || k, n: es.length,
    dice: nmean(es.map(e => e.metrics.dice)), dice_std: nstd(es.map(e => e.metrics.dice)),
    iou: nmean(es.map(e => e.metrics.iou)), iou_std: nstd(es.map(e => e.metrics.iou)),
    hd95: nmean(es.map(e => e.metrics.hd95)), hd95_std: nstd(es.map(e => e.metrics.hd95)),
    sens: nmean(es.map(e => e.metrics.sensitivity)),
    spec: nmean(es.map(e => e.metrics.specificity)), acc: nmean(es.map(e => e.metrics.pixel_acc)),
    params: es[0].params_M || "", tag: es.reduce((a, e) => (!a || e.metrics.dice > a.metrics.dice ? e : a)).tag,
  }));
}

function expMapHw2(d) {
  const stages = d.stages || {};

    const e = evals.find(x => x.stage === stage && x.prompt === prompt && x.split === "test");

    '<div class="em-flow"><b>提示矩阵：</b><span>每个阶段 × ' + (prompts || 10) + ' 种提示</span>' +

  "</div>";

function hw2PromptBars(d) {
  const evals = (d.evals || []).filter(e => e.dice != null && e.split === "test");
  if (!evals.length) return "";
  const stages = ["e1", "e2", "e3"].filter(s => evals.some(e => e.stage === s));
  if (!stages.length) return "";
  const PORDER = ["gt", "pert-20", "pert-10", "pert10", "pert20",
                  "point1", "point3", "point5", "auto", "auto10"];
  const prompts = PORDER.filter(p => evals.some(e => e.prompt === p))
    .concat([...new Set(evals.map(e => e.prompt))].filter(p => PORDER.indexOf(p) < 0));
  const series = stages.map(s => ({
    name: stageCN(s),
    values: prompts.map(p => {
      const hit = evals.find(e => e.stage === s && e.prompt === p);
      return hit && hit.dice != null ? hit.dice : null;
    }),
  }));
  return gbar(prompts.map(promptCN), series, { h: 280, yMax: 1, xLabel: "提示形式", fmt: v => v.toFixed(3) });
}
function hw2Robustness(d) {
  const order = ["pert-20", "pert-10", "gt", "pert10", "pert20"];
  const evals = (d.evals || []).filter(e => e.dice != null && e.split === "test" && order.indexOf(e.prompt) >= 0);
  if (!evals.length) return "";
  const stages = ["e1", "e2", "e3"].filter(s => evals.some(e => e.stage === s));
  const series = stages.map(s => ({
    name: s.toUpperCase(),
    pts: order.map((p, i) => {
      const hit = evals.find(e => e.stage === s && e.prompt === p);
      return hit && hit.dice != null ? [i, hit.dice] : null;
    }).filter(Boolean),
  })).filter(s => s.pts.length);
  if (!series.length) return "";
  return '<div class="muted" style="font-size:12.5px;margin-bottom:6px">横轴为提示框相对 GT 外接框的扰动幅度；曲线越平说明对提示误差越不敏感。</div>' +
    gchart(series, { h: 280, yLabel: "Dice", xLabel: "扰动幅度", smooth: true,
                     xTicks: ["-20%", "-10%", "GT", "+10%", "+20%"] });
}
function fmtLatency(ms) {
  if (ms == null || isNaN(ms)) return "—";
  return ms < 100 ? Number(ms).toFixed(1) + "ms" : (ms / 1000).toFixed(2) + "s";
}
function hw2LatencyBars(d) {
  const evals = (d.evals || []).filter(e => e.latency_ms != null && e.split === "test");
  if (!evals.length) return "";
  const cats = evals.map(e => stageCN(e.stage) + " · " + promptCN(e.prompt));
  return gbar(cats, [{ name: "单图延迟（毫秒）", values: evals.map(e => e.latency_ms) }],
    { h: 240, fmt: v => v.toFixed(1) + "ms" });
}
function hw2SensSpecBars(d) {
  const evals = (d.evals || []).filter(e => e.dice != null && e.split === "test");
  if (!evals.length) return "";
  const cats = evals.map(e => stageCN(e.stage) + " · " + promptCN(e.prompt));

    { name: "灵敏度", values: evals.map(e => e.sensitivity) },

}
function hw2CascadeBars(d) {

    { name: "自动框（U-Net 级联）", values: [pick("e1", "auto"), pick("e2", "auto")] },

    basis: epSec != null ? "按主对比单轮外推；384 组按像素比 (384/256)² 计 2.25 倍" : "缺少主对比日志",
    now: "✅ 已完成（6/6）" });
  rows.push({ name: "作业 1 · 五折交叉验证", sub: "2 模型 × 5 折 × 12 轮（train+val 重划分）",
    unit: epSec != null ? epSec * 12 * 10 * 0.83 : null, n: 10,
    basis: epSec != null ? "主对比单轮中位 × 0.83（2155/2594）× 10 折" : "缺少主对比日志",
    now: cvStatus });
  rows.push({ name: "作业 1 · 测试集评测", sub: "主对比 9 + 消融 6 = 15 组 × 1000 张",
    unit: evalN * 0.9, n: 15, basis: "人工口径 0.9 秒/张（热节流时会显著变慢）", now: "✅ 已完成" });
  rows.push({ name: "作业 2 · 嵌入缓存预计算", sub: "3694 张 × SAM 编码器",
    unit: onlineLat != null ? 3694 * onlineLat : null, n: 1,

    now: "✅ 已 100%（7.2GB）" });
  rows.push({ name: "作业 2 · E2 训练", sub: "冻结编码器微调",
    unit: e2 ? e2.sec * e2.ep : null, n: 1,
    basis: e2 ? "e2_box 实测 " + e2.ep + " 轮 × 单轮中位 " + Math.round(e2.sec) + " 秒" : "缺少 e2_box 日志",
    now: "✅ 已完成" });
  rows.push({ name: "作业 2 · E3 训练", sub: "LoRA(r=8) 微调",
    unit: e3 ? e3.sec * e3.ep : null, n: 1,
    basis: e3 ? "e3_lora 实测 " + e3.ep + " 轮 × 单轮中位 " + Math.round(e3.sec) + " 秒" : "缺少 e3_lora 日志",
    now: "✅ 已完成" });
  rows.push({ name: "作业 2 · E1/E2 评测", sub: "2 阶段 × 10 提示 × 1000 张（走缓存）",
    unit: cachedLat != null ? evalN * cachedLat : null, n: 20,

    now: "✅ 已完成" });

    now: "✅ 已完成" });

/* 采一个点：网络为累计字节，需与上一次采样差分出吞吐 */
function pushEnvSample(lv) {
  const now = Date.now();
  const s = { ts: now,
    cpu_user: lv.cpu_user_pct, cpu_sys: lv.cpu_sys_pct,
    mem_used: lv.mem_used_gb, swap_used: lv.swap_used_gb,
    load1: lv.load1, load5: lv.load5, load15: lv.load15,
    disk_mbps: lv.disk_mbps, proc_cpu: lv.proc_cpu_sum_pct,
    net_recv: null, net_sent: null, raw_ib: lv.net_ibytes, raw_ob: lv.net_obytes };
  const prev = envSamples[envSamples.length - 1];
  if (prev && lv.net_ibytes != null && prev.raw_ib != null && lv.net_ibytes >= prev.raw_ib) {
    const dt = (now - prev.ts) / 1000;
    if (dt > 0) {
      s.net_recv = (lv.net_ibytes - prev.raw_ib) / dt / 1024;   /* KB/s */
      s.net_sent = (lv.net_obytes - prev.raw_ob) / dt / 1024;
    }
  }
  envSamples.push(s);
  if (envSamples.length > 40) envSamples.shift();
}

function parseHash() {
  const h = location.hash.replace(/^#/, "") || "/";
  const qi = h.indexOf("?");
  const path = qi >= 0 ? h.slice(0, qi) : h;
  const query = new URLSearchParams(qi >= 0 ? h.slice(qi + 1) : "");
  return { path, query };
}
function markNav(path) {
  const key = path.startsWith("/dataset/") ? "/datasets" : path;
  document.querySelectorAll("#nav-links a").forEach(a =>
    a.classList.toggle("active", a.dataset.route === key));

/* =====================================================================
 * AI 聊天助手（DeepSeek SSE 流式）
 * ===================================================================== */
const chat = { open: false, messages: [], busy: false, ctrl: null };
const QUICK_QS = [
  "ISIC 2018 数据集怎么下载？",
  "Dice 和 IoU 有什么区别？",
  "E1/E2/E3 三阶段分别在做什么？",
];

function toggleChat(force) {
  chat.open = force != null ? force : !chat.open;
  document.getElementById("chat-panel").classList.toggle("open", chat.open);
  document.getElementById("chat-fab").textContent = chat.open ? "✕" : "💬";
  if (chat.open && !chat.messages.length) chatWelcome();
  if (chat.open) document.getElementById("chat-text").focus();
}
function chatWelcome() {
  addBubble("bot",
    "你好！我是本平台的研究助手 🤖<br>可以问我：<b>数据集怎么下载</b>、<b>指标/术语解释</b>（Dice、IoU、LoRA…）、<b>项目结构</b>（hw1 三模型、hw2 E1/E2/E3、级联系统）。下方有快捷问题，直接点即可。");
}
function addBubble(kind, html) {
  const body = document.getElementById("chat-body");
  const div = document.createElement("div");
  div.className = "msg " + (kind === "user" ? "user" : kind === "err" ? "err" : "bot");
  const b = document.createElement("div");
  b.className = "bubble";
  b.innerHTML = html;
  div.appendChild(b); body.appendChild(div);
  body.scrollTop = body.scrollHeight;
  return b;
}
/* 在已转义文本里包裹术语（不重复转义，供聊天气泡复用） */
function linkTermsInEscaped(html) {
  if (!termRegex || !state.glossary) return html;
  let out = "", last = 0, m;
  termRegex.lastIndex = 0;
  while ((m = termRegex.exec(html)) !== null) {
    const term = m[0], s = m.index, e = s + term.length;
    if (!isTermHit(html, s, e, term)) continue;
    out += html.slice(last, s);
    out += '<span class="term" data-term="' + esc(term) + '" tabindex="0" role="button">' + term + "</span>";
    last = e;
  }
  return out + html.slice(last);
}
function mdInline(s) {
  const codes = [];
  let out = esc(s).replace(/`([^`]+)`/g, (m, c) => {
    codes.push(c);
    return "\u0001" + (codes.length - 1) + "\u0002";
  });
  out = linkTermsInEscaped(out);
  out = out.replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
  out = out.replace(/\u0001(\d+)\u0002/g, (m, i) => "<code>" + codes[Number(i)] + "</code>");
  return out;
}
/* 行内格式 + 无序/有序列表 + 代码块（流式渲染时也安全） */
function mdText(t) {
  const lines = String(t).split("\n");
  let html = "", list = null;
  const closeList = () => { if (list) { html += "</" + list + ">"; list = null; } };
  lines.forEach(line => {
    const li = line.match(/^\s*(?:([-*])|(\d+)\.)\s+(.*)$/);
    if (li) {
      const kind = li[2] ? "ol" : "ul";
      if (list !== kind) { closeList(); html += "<" + kind + ">"; list = kind; }
      html += "<li>" + mdInline(li[3]) + "</li>";
    } else if (/^\s*#{1,4}\s+/.test(line)) {
      closeList();
      html += "<strong>" + mdInline(line.replace(/^\s*#{1,4}\s+/, "")) + "</strong><br>";
    } else {
      closeList();
      if (line.trim() !== "") html += mdInline(line) + "<br>";
    }
  });
  closeList();
  return html;
}
function mdBlock(src) {
  return String(src).split("```").map((part, i) => {
    if (i % 2 === 1) {
      const body = part.replace(/^[A-Za-z0-9_+-]*\n/, "").replace(/\n$/, "");
      return '<pre class="chat-pre"><code>' + esc(body) + "</code></pre>";
    }
    return mdText(part);
  }).join("");
}
function scrollChat() {
  const body = document.getElementById("chat-body");
  body.scrollTop = body.scrollHeight;
}
function setBusy(busy) {
  chat.busy = busy;
  document.getElementById("chat-send").style.display = busy ? "none" : "";
  document.getElementById("chat-stop").style.display = busy ? "" : "none";
  document.getElementById("chat-text").disabled = busy;
}
async function sendChat(text) {
  text = (text || "").trim();
  if (!text || chat.busy) return;
  if (!(state.overview && state.overview.chat_enabled)) {
    addBubble("err", "AI 助手未配置：请在 dataset_hub/.env 设置 DEEPSEEK_API_KEY 并重启服务。");
    return;
  }
  addBubble("user", esc(text));
  chat.messages.push({ role: "user", content: text });

  const bubble = addBubble("bot", '<span class="cursor"></span>');
  const bodyEl = () => bubble;
  setBusy(true);
  chat.ctrl = new AbortController();
  let full = "", errored = false;

  const handlePayload = payload => {
    if (payload === "[DONE]") return;
    let obj = null;
    try { obj = JSON.parse(payload); } catch (e) { return; }
    if (obj.error) {
      errored = true;
      bubble.innerHTML = "⚠️ " + esc(obj.error);
      return;
    }
    const delta = obj.choices && obj.choices[0] && obj.choices[0].delta && obj.choices[0].delta.content;
    if (delta) {
      full += delta;
      bubble.innerHTML = mdBlock(full) + '<span class="cursor"></span>';
      scrollChat();
    }
  };

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: chat.messages }),
      signal: chat.ctrl.signal,
    });
    if (!res.ok || !res.body) {
      let msg = "请求失败（HTTP " + res.status + "）";
      try { const j = await res.json(); if (j.error) msg = j.error; } catch (e) { /* keep default */ }
      throw new Error(msg);
    }
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, idx).trim();
        buf = buf.slice(idx + 1);
        if (line.startsWith("data:")) handlePayload(line.slice(5).trim());
        if (errored) break;
      }
      if (errored) break;
    }
    if (!errored) {
      bubble.innerHTML = full ? mdBlock(full) : "（空回复，请重试）";
      if (full) chat.messages.push({ role: "assistant", content: full });
    }
  } catch (err) {
    if (err.name === "AbortError") {
      bubble.innerHTML = (full ? mdBlock(full) : "") + "<br><span style='color:var(--text2);font-size:12px'>（已停止生成）</span>";
      if (full) chat.messages.push({ role: "assistant", content: full });
    } else {
      bubble.innerHTML = "⚠️ " + esc(err.message || "网络错误，请重试");
    }
  } finally {
    setBusy(false);
    chat.ctrl = null;
    scrollChat();
  }
}

/* 聊天控件绑定 */
document.getElementById("chat-fab").addEventListener("click", () => toggleChat());
document.getElementById("chat-close").addEventListener("click", () => toggleChat(false));
document.getElementById("chat-send").addEventListener("click", () => {
  const ta = document.getElementById("chat-text");
  sendChat(ta.value); ta.value = "";
});
document.getElementById("chat-stop").addEventListener("click", () => {
  if (chat.ctrl) chat.ctrl.abort();
});
document.getElementById("chat-text").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    const ta = e.target;
    sendChat(ta.value); ta.value = "";
  }
});
document.getElementById("chat-chips").innerHTML = QUICK_QS.map(q =>

document.getElementById("chat-chips").addEventListener("click", e => {

  if (b) sendChat(b.dataset.q);
