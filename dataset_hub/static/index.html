<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MedSeg Dataset Hub · 科研数据集展示平台</title>
<script>
/* 主题必须在首帧前应用，否则深色模式下会闪一下白屏 */
(function () {
  try {
    var t = localStorage.getItem("dh-theme");
    if (t !== "light" && t !== "dark") {
      t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }
    document.documentElement.dataset.theme = t;
  } catch (e) { /* 隐私模式下 localStorage 可能不可用，忽略 */ }
})();
</script>
<style>
/* ================= 设计系统：浅色 / 深色双主题 =================
 * 全部颜色走语义化 CSS 变量，主题切换只换变量、不动结构。
 * 深色配色参考 Grafana 暗色主题：低饱和深灰底 + 高对比数据色。 */
:root{
  color-scheme: light;
  --primary:#1a73e8; --primary-dark:#1557b0; --primary-weak:#e8f0fe;
  --primary-solid:#1a73e8;   /* 实心填充按钮底色：保证白字对比度 ≥4.5:1 */
  --bg:#f8f9fa; --card:#ffffff; --border:#e0e3e8;
  --text:#1f2329; --text2:#5f6470;
  --accent:#188038; --accent-weak:#e6f4ea;
  --danger:#d93025; --danger-weak:#fce8e6;
  --warn:#b06000; --warn-weak:#fef7e0;
  --violet:#7c3aed; --violet-weak:#f3e8fd;
  /* 次级表面 / 骨架 / 图表 / 代码块 / 遮罩 */
  --surface-2:#f1f3f4;
  --surface-3:#e8eaed;
  --skeleton:#eceef1;
  --chart-grid:#e9ebef;
  --chart-axis:#c8ccd4;
  --chart-area:.16;
  --code-bg:#f6f8fa;
  --code-key:#7c3aed;
  --toast-bg:#2d2f33; --toast-fg:#ffffff;
  --scrim:rgba(31,35,41,.48);
  --shadow:0 2px 10px rgba(31,35,41,.10);
  --shadow-lg:0 14px 44px rgba(31,35,41,.22);
  /* 图表数据色板（8 色，色相分散且对色盲友好） */
  --s1:#1a73e8; --s2:#7c3aed; --s3:#188038; --s4:#e37400;
  --s5:#d93025; --s6:#00838f; --s7:#c2185b; --s8:#5f6470;
  --radius:8px;
  --mono:"SF Mono",Menlo,Consolas,"Courier New",monospace;
}
[data-theme="dark"]{
  color-scheme: dark;
  --primary:#4c9aff; --primary-dark:#8ab4f8; --primary-weak:#16283f;
  --primary-solid:#1d5bbf;   /* 深色下用更深的实心蓝，白字才够清晰 */
  --bg:#0e1013; --card:#171a20; --border:#2a2f3a;
  --text:#e3e6ea; --text2:#98a0ac;
  --accent:#5bb974; --accent-weak:#14291c;
  --danger:#f28b82; --danger-weak:#33191a;
  --warn:#fdd663; --warn-weak:#33290f;
  --violet:#c58af9; --violet-weak:#271a38;
  --surface-2:#1f232b;
  --surface-3:#262b34;
  --skeleton:#242932;
  --chart-grid:#232833;
  --chart-axis:#3c4351;
  --chart-area:.22;
  --code-bg:#12151a;
  --code-key:#c58af9;
  --toast-bg:#e3e6ea; --toast-fg:#12151a;
  --scrim:rgba(0,0,0,.62);
  --shadow:0 2px 10px rgba(0,0,0,.45);
  --shadow-lg:0 14px 44px rgba(0,0,0,.62);
  --s1:#4c9aff; --s2:#c58af9; --s3:#5bb974; --s4:#fdd663;
  --s5:#f28b82; --s6:#4dd0e1; --s7:#f48fb1; --s8:#98a0ac;
}
/* 主题切换的过渡（只过渡颜色，避免布局抖动） */
body,.card,.nav,.btn,.chip,.tag,.badge,.bubble,footer,.about-table,.formula,.report-pre{
  transition:background-color .18s ease,border-color .18s ease,color .18s ease;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font:14px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Source Han Sans SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  font-variant-numeric:tabular-nums;
}
a{color:var(--primary);text-decoration:none}
a:hover{text-decoration:underline}
code,.mono{font-family:var(--mono);font-size:.92em}
h1,h2,h3{font-weight:600;line-height:1.35;margin:0 0 8px}
button{font-family:inherit}

/* ---- 顶部导航 ---- */
.nav{position:sticky;top:0;z-index:60;background:var(--card);border-bottom:1px solid var(--border)}
.nav-inner{max-width:1840px;margin:0 auto;padding:0 20px;height:56px;display:flex;align-items:center;gap:18px}
.brand{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:600;color:var(--text);white-space:nowrap}
.brand:hover{text-decoration:none}
.brand .logo{font-size:20px}
.brand .sub{font-size:12px;color:var(--text2);font-weight:400}
.nav-links{display:flex;gap:4px;margin-left:8px;flex:1}
.nav-links a{padding:6px 12px;border-radius:6px;color:var(--text2);font-weight:500;white-space:nowrap}
.nav-links a:hover{background:var(--primary-weak);color:var(--primary);text-decoration:none}
.nav-links a.active{background:var(--primary-weak);color:var(--primary)}
.nav-status{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2);white-space:nowrap;cursor:default}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.dot.green{background:var(--accent);box-shadow:0 0 0 3px var(--accent-weak)}
.dot.yellow{background:#e37400;box-shadow:0 0 0 3px var(--warn-weak)}
.nav-burger{display:none;margin-left:auto;background:none;border:1px solid var(--border);border-radius:6px;padding:5px 10px;font-size:16px;cursor:pointer;color:var(--text2)}
.theme-btn{background:none;border:1px solid var(--border);border-radius:6px;width:34px;height:30px;font-size:15px;
  cursor:pointer;color:var(--text2);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.15s}
.theme-btn:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-weak)}
/* 全局运行指示：任何页面都能看到当前在跑什么 */
.nav-live{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2);
  white-space:nowrap;cursor:pointer;padding:4px 8px;border-radius:6px;border:1px solid transparent}
.nav-live:hover{background:var(--primary-weak);color:var(--primary);border-color:var(--border)}
.nav-live.busy{color:var(--accent);font-weight:500}
@media (max-width:1400px){.nav-links a{padding:6px 8px}.nav-live{max-width:190px;overflow:hidden;text-overflow:ellipsis}}
@media (max-width:1100px){.nav-live{max-width:160px;overflow:hidden;text-overflow:ellipsis}}
@media (max-width:767px){.nav-live{display:none}}

/* ---- 布局 ---- */
.container{max-width:1840px;margin:0 auto;padding:0 22px}
.view{padding:28px 0 60px;animation:fadein .22s ease}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ---- 卡片 ---- */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px 20px;transition:transform .18s ease,box-shadow .18s ease}
a.card{display:block;color:var(--text)}
a.card:hover,.card.lift:hover{transform:translateY(-2px);box-shadow:var(--shadow);text-decoration:none}
.card h3{margin:0 0 6px;font-size:15.5px}
.card .muted{color:var(--text2);font-size:13px}

/* ---- 徽标 / 标签 / chips ---- */
.tag{display:inline-block;padding:1px 8px;border-radius:4px;font-size:12px;font-weight:500;
  background:var(--primary-weak);color:var(--primary-dark);vertical-align:1px}
.tag.cat{background:var(--surface-2);color:var(--text2)}
.lic{display:inline-block;padding:2px 10px;border-radius:4px;font-size:12.5px;font-weight:600;
  background:var(--accent-weak);color:var(--accent);border:1px solid var(--border);cursor:pointer}
.lic:hover{background:var(--accent-weak)}
.src{display:inline-block;padding:1px 8px;border-radius:4px;font-size:12px;font-weight:500}
.src.official{background:var(--primary-weak);color:var(--primary-dark)}
.src.mirror{background:var(--violet-weak);color:var(--violet)}
.src.other{background:var(--surface-2);color:var(--text2)}
.chiprow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{padding:5px 14px;border-radius:999px;border:1px solid var(--border);background:var(--card);
  color:var(--text2);font-size:13px;cursor:pointer;transition:.15s}
.chip:hover{border-color:var(--primary);color:var(--primary)}
.chip.active{background:var(--primary-solid);border-color:var(--primary-solid);color:#fff;font-weight:500}

/* ---- 按钮 ---- */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 16px;border-radius:6px;
  border:1px solid var(--border);background:var(--card);color:var(--text);font-size:13.5px;
  cursor:pointer;transition:.15s;text-decoration:none}
.btn:hover{border-color:var(--primary);color:var(--primary);text-decoration:none}
.btn.primary{background:var(--primary-solid);border-color:var(--primary-solid);color:#fff;font-weight:500}
.btn.primary:hover{filter:brightness(1.12);color:#fff}
.btn.sm{padding:3px 10px;font-size:12.5px;border-radius:5px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.link{border:none;background:none;color:var(--primary);padding:4px 6px}

/* ---- Hero ---- */
.hero{padding:46px 0 30px}
.hero .pill{display:inline-block;padding:3px 12px;border-radius:999px;background:var(--primary-weak);
  color:var(--primary-dark);font-size:12.5px;font-weight:500;margin-bottom:14px}
.hero h1{font-size:32px;margin-bottom:10px}
.hero .lead{font-size:15.5px;color:var(--text2);max-width:760px;margin:0 0 22px}
.statrow{display:flex;gap:44px;flex-wrap:wrap;margin-bottom:24px}
.stat .num{font-family:var(--mono);font-size:32px;font-weight:700;color:var(--primary);line-height:1.1}
.stat .lab{font-size:13px;color:var(--text2)}
.ctarow{display:flex;gap:10px;flex-wrap:wrap}

/* ---- 区块标题 ---- */
.sec{margin-top:34px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
.sec-head h2{font-size:19px;margin:0}
.sec-head .more{font-size:13px}

/* ---- 网格 ---- */
.grid{display:grid;gap:16px}
.grid > *{min-width:0}   /* 防止宽表/长文件名把网格列撑破（grid 子项默认 min-width:auto） */
/* Grafana 式 12 列仪表盘网格：面板按 col-* 占列，窄屏自动折叠 */
.g12{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.g12 > *{min-width:0}
.col-2{grid-column:span 2}.col-3{grid-column:span 3}.col-4{grid-column:span 4}
.col-5{grid-column:span 5}.col-6{grid-column:span 6}.col-7{grid-column:span 7}
.col-8{grid-column:span 8}.col-9{grid-column:span 9}.col-12{grid-column:span 12}
@media (max-width:1280px){
  .col-3{grid-column:span 4}.col-5{grid-column:span 6}.col-7{grid-column:span 12}
  .col-4{grid-column:span 6}
}
@media (max-width:900px){
  .g12 > [class*="col-"]{grid-column:1/-1}
}
/* 面板头（Grafana panel header）：标题 + 右侧元信息 */
.ph{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.ph h3{margin:0;font-size:14.5px}
.ph .p-meta{font-size:12px;color:var(--text2);font-family:var(--mono);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
/* 阈值着色（Grafana value mapping） */
.vt-good{color:var(--accent);font-weight:600}
.vt-mid{color:var(--warn);font-weight:600}
.vt-bad{color:var(--danger);font-weight:600}
/* 表格行可点击 */
.row-click{cursor:pointer}
.row-click:hover{background:var(--surface-2)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-2{grid-template-columns:repeat(2,1fr)}
.grid-4{grid-template-columns:repeat(4,1fr)}

/* ---- 榜单速览横条 ---- */
.lb-strip{display:flex;flex-wrap:wrap;gap:10px 28px;align-items:center;background:var(--accent-weak);
  border:1px solid var(--border);border-radius:var(--radius);padding:14px 20px}
.lb-strip .t{font-weight:600;color:var(--accent);white-space:nowrap}
.lb-strip .item{font-size:13px;color:var(--text)}
.lb-strip .item b{color:var(--accent)}
.lb-strip a{color:var(--text);border-bottom:1px dotted var(--accent)}
.lb-strip a:hover{text-decoration:none;color:var(--accent)}

/* ---- 列表页工具行 ---- */
.toolbar{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.search{flex:1;min-width:220px;max-width:420px;position:relative}
.search input{width:100%;padding:8px 12px 8px 34px;border:1px solid var(--border);border-radius:6px;
  font-size:13.5px;background:var(--card);color:var(--text);outline:none;transition:.15s}
.search input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-weak)}
.search .ico{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text2);font-size:14px}

/* ---- 详情页 ---- */
.crumbs{font-size:13px;color:var(--text2);margin-bottom:14px}
.crumbs a{color:var(--text2)}
.crumbs a:hover{color:var(--primary)}
.detail-grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}
.side{display:flex;flex-direction:column;gap:16px;position:sticky;top:76px}
.info-table{width:100%;border-collapse:collapse;font-size:13px}
.info-table td{padding:7px 0;border-bottom:1px dashed var(--border);vertical-align:top}
.info-table tr:last-child td{border-bottom:none}
.info-table td:first-child{color:var(--text2);white-space:nowrap;padding-right:14px}
.dl-row{padding:13px 0;border-bottom:1px dashed var(--border)}
.dl-row:last-child{border-bottom:none}
.dl-main{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dl-name{font-weight:500;flex:1;min-width:200px}
.dl-meta{font-size:12.5px;color:var(--text2);font-family:var(--mono)}
.dl-btns{display:flex;gap:6px}
.dl-check{margin-top:7px;font-size:12.5px;line-height:1.6;display:none;padding:7px 10px;border-radius:6px}
.dl-check.ok{display:block;background:var(--accent-weak);color:var(--accent)}
.dl-check.bad{display:block;background:var(--danger-weak);color:var(--danger)}
.dl-check.warn{display:block;background:var(--warn-weak);color:var(--warn)}
.lb-row{padding:11px 0;border-bottom:1px dashed var(--border)}
.lb-row:last-child{border-bottom:none}
.lb-row .name{font-weight:500}
.lb-row .name a{margin-left:6px;font-size:12px}
.lb-row .note{font-size:12.5px;color:var(--text2);margin-top:2px}
.stat-table{width:100%;border-collapse:collapse;font-size:13.5px}
.stat-table td{padding:7px 0;border-bottom:1px dashed var(--border)}
.stat-table tr:last-child td{border-bottom:none}
.stat-table td:first-child{color:var(--text2)}
.stat-table td:last-child{font-family:var(--mono);font-weight:600;text-align:right}

/* ---- 术语 ---- */
.term{border-bottom:1px dotted var(--primary);cursor:help;color:inherit}
.term:hover{color:var(--primary);background:var(--primary-weak);border-bottom-style:solid}
#term-tip{position:fixed;z-index:95;max-width:320px;background:var(--card);border:1px solid var(--border);
  border-radius:8px;box-shadow:var(--shadow-lg);padding:12px 14px;font-size:12.5px;
  display:none;pointer-events:none}
#term-tip .tt-name{font-weight:600;font-size:13.5px}
#term-tip .tt-en{color:var(--text2);margin:1px 0 6px}
#term-tip .tt-def{line-height:1.6}
#term-tip .tt-go{margin-top:8px;color:var(--primary);font-size:12px}
.formula{font-family:var(--mono);font-size:12.5px;background:var(--surface-2);border:1px solid var(--border);
  border-radius:6px;padding:8px 12px;margin-top:8px;overflow-x:auto;white-space:nowrap}
.g-term{padding:14px 0;border-bottom:1px dashed var(--border)}
.g-term:last-child{border-bottom:none}
.g-term .head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.g-term .name{font-weight:600;font-size:15px}
.g-term .en{color:var(--text2);font-size:12.5px}
.g-term .def{margin-top:5px;font-size:13.5px}
.g-group{margin-bottom:8px}
.flash{animation:flashbg 2.2s ease}
@keyframes flashbg{0%,30%{background:var(--warn-weak)}100%{background:transparent}}

/* ---- 状态组件 ---- */
.skel{background:var(--skeleton);border-radius:6px;height:14px;animation:pulse 1.2s ease-in-out infinite;margin-bottom:10px}
.skel.t{height:22px;width:45%}.skeleton-card .skel:last-child{margin-bottom:0}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.err-box{background:var(--danger-weak);border-left:3px solid var(--danger);color:var(--danger);
  border-radius:6px;padding:12px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.err-box .btn{border-color:var(--danger);color:var(--danger)}
.empty{text-align:center;padding:52px 20px;color:var(--text2)}
.empty .emoji{font-size:40px;margin-bottom:10px}

/* ---- 架构页 ---- */
.arch-svg{width:100%;height:auto;display:block}
.svg-box{fill:var(--card);stroke:var(--border)}
.svg-box.blue{fill:var(--primary-weak);stroke:var(--primary)}
.svg-box.green{fill:var(--accent-weak);stroke:var(--accent)}
.svg-box.dashed{stroke-dasharray:5 4;fill:var(--surface-2)}
.svg-txt{font-size:12.5px;fill:var(--text)}
.svg-txt.b{font-weight:600;font-size:13px}
.svg-txt.s{font-size:11px;fill:var(--text2)}
.svg-txt.blue{fill:var(--primary-dark)}
.svg-line{stroke:var(--chart-axis);stroke-width:1.4;fill:none;marker-end:url(#arrow)}
.svg-lab{font-size:11px;fill:var(--text2)}
.about-table{width:100%;border-collapse:collapse;font-size:13.5px;background:var(--card);
  border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.about-table th,.about-table td{padding:10px 14px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
.about-table th{background:var(--surface-2);font-weight:600}
.about-table tr:last-child td{border-bottom:none}
.chain{counter-reset:step;padding-left:0;list-style:none;margin:0}
.chain li{counter-increment:step;position:relative;padding:10px 0 10px 44px;border-bottom:1px dashed var(--border);font-size:13.5px}
.chain li:last-child{border-bottom:none}
.chain li::before{content:counter(step);position:absolute;left:0;top:12px;width:28px;height:28px;border-radius:50%;
  background:var(--primary-weak);color:var(--primary-dark);font-weight:600;display:flex;align-items:center;justify-content:center}
.svc-card{border-top:3px solid var(--primary)}
.svc-card .port{font-family:var(--mono);font-size:12.5px;color:var(--text2)}

/* ---- 实验观测视图 ---- */
.run-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px dashed var(--border);flex-wrap:wrap}
.run-row:last-child{border-bottom:none}
.run-tag{font-family:var(--mono);font-weight:600;font-size:13px;min-width:150px}
.run-metric{font-family:var(--mono);font-size:12.5px;color:var(--text2)}
.badge{display:inline-block;padding:1px 9px;border-radius:4px;font-size:12px;font-weight:500}
.badge.done{background:var(--accent-weak);color:var(--accent)}
.badge.running{background:var(--primary-weak);color:var(--primary-dark)}
.badge.pending{background:var(--surface-2);color:var(--text2)}
/* 数值表：首列左对齐，其余列右对齐（表头与数据一致） */
.num-table td:not(:first-child){text-align:right;padding-left:14px}   /* 列间留白：防止相邻数值黏连（如 0.6060.49093.9） */
/* 宽表横向滚动容器（移动端防溢出） */
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.stage-card{border-top:3px solid var(--border)}
.stage-card.done{border-top-color:var(--accent)}
.stage-card.running{border-top-color:var(--primary)}
.stage-card .metric-big{font-family:var(--mono);font-size:24px;font-weight:700;color:var(--text)}
.chart-legend{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;font-size:12.5px;color:var(--text2)}
.chart-legend .dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.chart-legend .lg{display:inline-flex;align-items:center;gap:6px;background:none;border:1px solid transparent;
  border-radius:5px;padding:2px 7px;color:var(--text2);font-size:12.5px;cursor:pointer;font-family:inherit;transition:.14s}
.chart-legend .lg:hover{background:var(--surface-2);color:var(--text)}
.chart-legend .lg.off{opacity:.38;text-decoration:line-through}
.c-tick{font-size:10.5px;fill:var(--text2);font-family:var(--mono)}
.c-axlabel{font-size:11px;fill:var(--text2)}
/* 图表容器 + 悬停 tooltip */
.gchart{position:relative}
.gc-tip{position:absolute;display:none;pointer-events:none;background:var(--card);border:1px solid var(--border);
  border-radius:7px;box-shadow:var(--shadow-lg);padding:8px 10px;font-size:12px;min-width:150px;z-index:20}
.gc-tip .tip-x{color:var(--text2);font-family:var(--mono);font-size:11px;margin-bottom:4px;
  border-bottom:1px dashed var(--border);padding-bottom:3px}
.gc-tip .tip-row{display:flex;align-items:center;gap:6px;line-height:1.7}
.gc-tip .tip-row .dot{width:9px;height:9px;border-radius:2.5px;flex-shrink:0}
.gc-tip .tip-row .tip-n{flex:1;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px}
.gc-tip .tip-row b{font-family:var(--mono);color:var(--text)}
/* Grafana 风统计面板 */
.gstat{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;min-width:0}
.gstat .gs-lab{font-size:12px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gstat .gs-val{font-family:var(--mono);font-size:24px;font-weight:700;line-height:1.25;margin-top:2px}
.gstat .gs-unit{font-size:12px;font-weight:400;color:var(--text2);margin-left:3px}
.gstat .gs-sub{font-size:11.5px;color:var(--text2);margin-top:2px}
.grid-stats{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.prog{background:var(--skeleton);border-radius:999px;height:10px;overflow:hidden;flex:1;min-width:120px}
.prog > i{display:block;height:100%;background:var(--accent);border-radius:999px}
.prog-row{display:flex;align-items:center;gap:12px;padding:7px 0;font-size:13px}
.prog-row .lab{width:52px;color:var(--text2);font-family:var(--mono)}
.prog-row .val{width:150px;text-align:right;font-family:var(--mono);font-size:12.5px;color:var(--text2)}
.file-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--border);font-size:13px;flex-wrap:wrap}
.file-row:last-child{border-bottom:none}
.file-row .nm{font-family:var(--mono);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.report-pre{background:var(--code-bg);border:1px solid var(--border);border-radius:6px;padding:14px;
  font-family:var(--mono);font-size:12px;line-height:1.7;overflow-x:auto;white-space:pre-wrap;max-height:420px;overflow-y:auto}
.fig-frame{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px;text-align:center}

/* ---- 弹窗（运行详情 / 评测档案 / 源码 / 图片灯箱） ---- */
.modal{position:fixed;inset:0;z-index:120;background:var(--scrim);display:none;align-items:center;justify-content:center;padding:24px}
.modal-card{background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-lg);
  width:min(760px,100%);max-height:88vh;display:flex;flex-direction:column;overflow:hidden}
.modal.wide .modal-card{width:min(1080px,100%)}
.modal-head{display:flex;align-items:center;gap:12px;padding:13px 18px;border-bottom:1px solid var(--border);flex-shrink:0}
.modal-head b{flex:1;font-size:14px;font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.modal-x{background:none;border:none;font-size:16px;color:var(--text2);cursor:pointer;padding:3px 8px;border-radius:5px}
.modal-x:hover{background:var(--surface-2);color:var(--text)}
.modal-body{padding:18px;overflow-y:auto}
.lightbox-img{width:100%;height:auto;border-radius:8px;border:1px solid var(--border)}
.code-view{max-height:64vh;font-size:11.5px;line-height:1.65;white-space:pre;overflow:auto}

/* ---- 图表画廊 ---- */
.gallery{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.gal-item{margin:0;cursor:zoom-in;border:1px solid var(--border);border-radius:10px;overflow:hidden;
  background:var(--card);transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease}
.gal-item:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--primary)}
/* contain 而不是 cover：图表类图片裁掉边缘就等于毁掉可读性（图片具体尺寸样式见下方「画廊」区） */
.lb-wrap{background:var(--surface-2);border-radius:10px;padding:10px;text-align:center}
.lb-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}

/* ---- 实时运行面板 ---- */
.live-panel{padding:12px 16px}
.live-empty{font-size:13px;color:var(--text2);display:flex;align-items:center;gap:8px}
.live-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);
  margin-right:5px;animation:livepulse 1.4s ease-in-out infinite}
@keyframes livepulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.72)}}
.live-item{padding:10px 0;border-bottom:1px dashed var(--border)}
.live-item:last-child{border-bottom:none}
.live-item.done{opacity:.7}
.live-item.stale{opacity:.55}
.live-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.live-age{margin-left:auto;font-size:11.5px;color:var(--text2);font-family:var(--mono)}
.live-bar{position:relative;height:18px;background:var(--skeleton);border-radius:5px;margin-top:7px;overflow:hidden}
.live-bar i{display:block;height:100%;border-radius:5px;transition:width .6s ease;
  background:linear-gradient(90deg,var(--primary),var(--violet))}
.live-bar span{position:absolute;right:8px;top:0;font-size:10.5px;line-height:18px;color:var(--text);font-family:var(--mono)}
.live-detail{font-size:12px;color:var(--text2);margin-top:5px;font-family:var(--mono)}
.live-eta{font-size:12px;margin-top:5px;color:var(--text2)}
.live-eta b{color:var(--text);font-weight:600}
.live-other{margin-top:10px;padding-top:9px;border-top:1px dashed var(--border);font-size:12.5px;color:var(--text2)}
.live-other a{color:var(--primary)}
/* 实验地图：一眼看清做了哪些实验、彼此什么关系 */
.exp-map{display:flex;flex-direction:column;gap:10px}
.exp-map .em-row{display:flex;align-items:stretch;gap:10px;flex-wrap:wrap}
.em-box{flex:1;min-width:170px;border:1px solid var(--border);border-radius:8px;
  padding:10px 12px;background:var(--surface-2)}
.em-box .em-t{font-weight:600;font-size:13.5px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.em-box .em-s{font-size:12px;color:var(--text2);margin-top:3px;line-height:1.55}
.em-box .em-v{font-family:var(--mono);font-size:17px;font-weight:700;margin-top:4px}
.em-arrow{align-self:center;color:var(--text2);font-size:18px;flex:0 0 auto}
.em-flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--text2);
  border-top:1px dashed var(--border);padding-top:9px}
.em-flow b{color:var(--text)}
.em-flow .em-chip{font-family:var(--mono);background:var(--surface-2);border:1px solid var(--border);
  border-radius:5px;padding:2px 7px;color:var(--text)}
@media (max-width:767px){.em-arrow{display:none}}

/* ---- 源码浏览器 ---- */
.code-list{display:flex;flex-direction:column;gap:2px;max-height:330px;overflow-y:auto}
.code-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:none;
  border-radius:6px;padding:7px 10px;cursor:pointer;color:var(--text);font-size:13px;transition:.14s}
.code-item:hover{background:var(--primary-weak);color:var(--primary-dark)}
.code-item .mono{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fig-frame img{max-width:100%;height:auto;border-radius:4px}

/* ---- 左侧章节导航（page-nav，U1） ---- */
.page-with-nav{display:grid;grid-template-columns:208px minmax(0,1fr);gap:20px;align-items:start}
.page-nav{position:sticky;top:68px;align-self:start;max-height:calc(100vh - 80px);overflow:auto;
  background:var(--card);border:1px solid var(--border);border-radius:12px;padding:8px}
.pn-item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:none;
  border-left:3px solid transparent;border-radius:6px;padding:0 10px;height:34px;margin:1px 0;
  color:var(--text2);font-size:13px;cursor:pointer;transition:.14s;font-family:inherit}
.pn-item:hover{background:var(--surface-2);color:var(--text)}
.pn-item .pn-num{font-family:var(--mono);font-size:11px;color:var(--text2);width:18px;flex-shrink:0}
.pn-item.active{border-left-color:var(--primary);background:var(--primary-weak);color:var(--primary);font-weight:600}
.pn-item.active .pn-num{color:var(--primary)}
.pn-item:focus-visible{outline:2px solid var(--primary);outline-offset:-2px}
.page-main{min-width:0}
[data-sec]{scroll-margin-top:84px}
@media (max-width:1024px){
  /* 窄屏降级：侧栏 → 吸顶横向 chip 条（沿用同一 DOM，不另加组件） */
  .page-with-nav{display:block}
  .page-nav{position:sticky;top:56px;z-index:55;display:flex;flex-direction:row;align-items:center;
    overflow-x:auto;max-height:none;gap:6px;padding:8px;border-radius:8px;margin-bottom:14px}
  .pn-item{width:auto;height:30px;white-space:nowrap;border-left:none;border:1px solid var(--border);
    border-radius:999px;padding:0 12px;flex-shrink:0;margin:0}
  .pn-item .pn-num{display:none}
  .pn-item.active{border-color:var(--primary-solid);background:var(--primary-solid);color:#fff}
}

/* ---- 折叠组件（U2：长列表默认折叠，图表卡/画廊永不动用） ---- */
.clps{position:relative}
.clps-body{max-height:188px;overflow:hidden;transition:max-height .22s ease}
.clps.open .clps-body{max-height:none}
.clps-fade{position:absolute;left:0;right:0;bottom:29px;height:26px;pointer-events:none;display:none;
  background:linear-gradient(to top,var(--card) 30%,rgba(0,0,0,0))}
.clps:not(.open) .clps-fade{display:block}
.clps-toggle{display:flex;align-items:center;gap:5px;width:100%;text-align:left;background:none;border:none;
  color:var(--primary);font-size:12.5px;padding:6px 0 1px;cursor:pointer;font-family:inherit}
.clps-toggle:hover{color:var(--primary-dark)}
.clps-toggle .cv{display:inline-block;font-size:10px;transition:transform .2s ease}
.clps.open .clps-toggle .cv{transform:rotate(90deg)}

/* ---- 画廊：两行说明 caption + 宽图跨两列（U3/U4d） ---- */
.gal-item img{width:100%;height:auto;max-height:280px;object-fit:contain;background:var(--surface-2);display:block;padding:8px}
.gal-item figcaption{padding:6px 10px 7px;border-top:1px solid var(--border);overflow:hidden}
.gal-item .gal-title{font-size:12.5px;color:var(--text);font-family:inherit;font-weight:500;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gal-item .gal-name{font-size:11px;color:var(--text2);font-family:var(--mono);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.gallery{grid-auto-flow:dense}   /* 宽图跨列后用 dense 回填空洞 */
.gallery .span2{grid-column:span 2}
.gallery .span-all{grid-column:1/-1}
.gallery.gal-wide{grid-template-columns:repeat(2,1fr)}
.gallery.gal-wide .gal-item{grid-column:auto}
@media (max-width:900px){.gallery .span2{grid-column:auto}.gallery.gal-wide{grid-template-columns:1fr}}

/* ---- 外置图目录说明区（U6） ---- */
.fn-group{font-size:13px;font-weight:600;margin:12px 0 4px;padding-left:8px;border-left:3px solid var(--primary)}
.fn-item{padding:8px 0;border-bottom:1px dashed var(--border);border-radius:4px}
.fn-item:last-child{border-bottom:none}
.fn-head{font-size:13px;color:var(--text)}
.fn-item .gal-name{display:inline;margin-left:6px}
.fn-line{font-size:12.5px;color:var(--text2);line-height:1.65;margin-top:2px}
.fn-line b{color:var(--text2);margin-right:6px;font-size:12px}
/* 灯箱说明 */
.lb-cap{margin-top:12px;text-align:left}
.lb-title{font-size:14px;font-weight:600;margin-bottom:4px}
.lb-title .gal-name{display:inline;margin-left:8px}
.lb-line{font-size:12.5px;color:var(--text2);line-height:1.7;margin-top:2px}
.lb-line .lb-k{display:inline-block;background:var(--surface-2);border-radius:4px;padding:0 6px;
  margin-right:7px;font-size:12px;color:var(--text2)}
.lb-line .mono{color:var(--text2)}
.lb-pos{margin-left:12px;color:var(--text2)}

/* ---- 页脚 ---- */
footer{border-top:1px solid var(--border);background:var(--card);padding:20px 0;margin-top:20px}
footer .container{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--text2);font-size:12.5px}

/* ---- 聊天助手 ---- */
#chat-fab{position:fixed;right:24px;bottom:24px;width:56px;height:56px;border-radius:50%;border:none;
  background:var(--primary-solid);color:#fff;font-size:24px;cursor:pointer;z-index:80;
  box-shadow:0 4px 18px rgba(26,115,232,.42);transition:.18s}
#chat-fab:hover{transform:scale(1.06);filter:brightness(1.12)}
#chat-panel{position:fixed;right:24px;bottom:92px;width:380px;height:520px;max-height:calc(100vh - 120px);
  background:var(--card);border:1px solid var(--border);border-radius:12px;z-index:85;display:none;
  flex-direction:column;overflow:hidden;box-shadow:var(--shadow-lg)}
#chat-panel.open{display:flex;animation:fadein .18s ease}
.chat-head{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--border);background:var(--card)}
.chat-head .t{font-weight:600;font-size:14px;flex:1}
.chat-head .sub{font-size:11.5px;color:var(--text2)}
.chat-close{background:none;border:none;font-size:17px;color:var(--text2);cursor:pointer;padding:2px 6px;border-radius:4px}
.chat-close:hover{background:var(--surface-2);color:var(--text)}
.chat-body{flex:1;overflow-y:auto;padding:14px;background:var(--bg);display:flex;flex-direction:column}
.msg{display:flex;margin-bottom:10px}
.msg.user{justify-content:flex-end}
.bubble{max-width:84%;padding:9px 12px;border-radius:10px;font-size:13.5px;line-height:1.65;word-break:break-word}
.msg.user .bubble{background:var(--primary-solid);color:#fff;border-bottom-right-radius:4px}
.msg.bot .bubble{background:var(--card);border:1px solid var(--border);border-bottom-left-radius:4px}
.msg.err .bubble{background:var(--danger-weak);border-color:var(--border);color:var(--danger);font-size:12.5px}
.bubble code{background:var(--surface-2);padding:1px 5px;border-radius:4px}
.msg.user .bubble code{background:rgba(255,255,255,.18)}
.cursor{display:inline-block;width:7px;height:14px;background:var(--text2);vertical-align:-2px;
  animation:blink .9s steps(1) infinite;margin-left:2px}
@keyframes blink{50%{opacity:0}}
.chat-note{font-size:12px;color:var(--warn);background:var(--warn-weak);border-radius:6px;padding:8px 12px;margin:0 14px 8px;display:none}
.chat-chips{display:flex;gap:6px;padding:0 14px 10px;flex-wrap:wrap}
.chat-chips .chip{font-size:12px;padding:4px 10px}
.chat-input{display:flex;gap:8px;padding:10px 14px 14px;border-top:1px solid var(--border);background:var(--card)}
.chat-input textarea{flex:1;resize:none;border:1px solid var(--border);border-radius:8px;padding:8px 10px;
  font:13.5px/1.5 inherit;font-family:inherit;color:var(--text);outline:none;max-height:96px}
.chat-input textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-weak)}
#toast{position:fixed;left:50%;bottom:36px;transform:translateX(-50%) translateY(8px);background:var(--toast-bg);color:var(--toast-fg);
  padding:9px 18px;border-radius:8px;font-size:13px;z-index:99;opacity:0;pointer-events:none;transition:.25s}
#toast.show{opacity:1;transform:translateX(-50%)}

/* ---- 聊天气泡内的 Markdown（列表 / 代码块 / 术语） ---- */
.bubble ul,.bubble ol{margin:5px 0 5px 20px;padding:0}
.bubble li{margin:2px 0}
.bubble .chat-pre{margin:7px 0;padding:9px 11px;background:var(--code-bg);border:1px solid var(--border);
  border-radius:6px;overflow-x:auto;font-size:12px;line-height:1.6;white-space:pre}
.bubble .chat-pre code{background:none;padding:0;font-size:inherit}
.bubble .term{cursor:pointer}

/* ---- 回到顶部（页内锚点滚动留白统一由 [data-sec]{scroll-margin-top} 负责） ---- */
#to-top{position:fixed;right:24px;bottom:92px;width:40px;height:40px;border-radius:50%;z-index:78;
  border:1px solid var(--border);background:var(--card);color:var(--text2);font-size:17px;cursor:pointer;
  display:none;box-shadow:var(--shadow);transition:.15s}
#to-top.show{display:flex;align-items:center;justify-content:center}
#to-top:hover{color:var(--primary);border-color:var(--primary)}
@media (max-width:767px){#to-top{right:16px;bottom:82px}}

/* ---- 响应式 ---- */
@media (max-width:1100px){
  .grid-3{grid-template-columns:repeat(2,1fr)}
  .grid-4{grid-template-columns:repeat(2,1fr)}
  .detail-grid{grid-template-columns:minmax(0,1fr) 264px}
}
@media (max-width:767px){
  .nav-inner{gap:10px}
  .brand{flex-shrink:1;min-width:0}
  .brand .sub{display:none}
  .nav-burger{flex-shrink:0}
  .nav-links{display:none;position:absolute;top:56px;left:0;right:0;background:var(--card);
    border-bottom:1px solid var(--border);flex-direction:column;padding:8px 12px;gap:2px;margin:0}
  .nav-links a{padding:10px 12px}
  .nav.open .nav-links{display:flex}
  .nav-burger{display:block}
  .nav-status .st-lab{display:none}
  .grid-2,.grid-3,.grid-4{grid-template-columns:1fr}
  .detail-grid{grid-template-columns:1fr}
  .side{position:static}
  .hero h1{font-size:25px}
  .hero{padding:30px 0 20px}
  .statrow{gap:26px}
  .stat .num{font-size:26px}
  #chat-panel{right:0;bottom:0;width:100%;height:100%;max-height:none;border-radius:0;border:none}
  #chat-fab{right:16px;bottom:16px}
  .sec-head{flex-wrap:wrap}
  /* 实验视图移动端：文件名折行、进度行两行布局、宽表横向滚动 */
  .file-row .nm{white-space:normal;word-break:break-all;flex-basis:100%}
  .prog-row{flex-wrap:wrap}
  .prog-row .lab{order:1;width:auto;min-width:44px}
  .prog-row .val{order:2;width:auto;flex:1;text-align:right;font-size:11.5px}
  .prog-row .prog{order:3;flex-basis:100%;min-width:0;margin-top:5px}
  .table-scroll table{min-width:560px}
}
</style>
</head>
<body>

<nav class="nav" id="nav">
  <div class="nav-inner">
    <a class="brand" href="#/"><span class="logo">🔬</span>MedSeg Dataset Hub<span class="sub">科研数据集门户</span></a>

      <a href="#/" data-route="/">🏠 首页</a>

      <a href="#/hw1" data-route="/hw1">🧠 作业 1 · U-Net</a>

      <span class="dot green" id="nav-live-dot"></span><span id="nav-live-text">检测中…</span>

<main id="app" class="container"><div class="view"><div class="skel t"></div><div class="skel" style="width:80%"></div><div class="skel" style="width:60%"></div></div></main>

<footer>

<script>
"use strict";
/* =====================================================================
 * MedSeg Dataset Hub 前端 · 单文件 SPA（无构建 / 无 CDN）

/* ---------------- 全局状态 ---------------- */
const state = {
  overview: null, datasets: null, glossary: null, byTerm: {},
  hw1: null, hw2: null, hw1Sel: null, hw1Group: "main",
  dataPromise: null, dataError: null,

const listState = { cat: "全部", q: "" };
const glossState = { cat: "全部", q: "" };
let glossIds = {};   // 术语 → 术语表锚点 id（renderList 时重建）

const $ = (sel, root) => (root || document).querySelector(sel);
const app = document.getElementById("app");

/* ---------------- 工具函数 ---------------- */
function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
function escRegExp(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }
function fmtBytes(n) {
  if (n == null || isNaN(n)) return "";
  const u = ["B", "KB", "MB", "GB", "TB"]; let i = 0, v = n;
  while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; }
  return (i === 0 ? v : v.toFixed(1)) + " " + u[i];
}
/* 数据集统计的取值格式化（与图表刻度的 fmtTickVal 是两个函数，勿混用） */
function fmtStatNum(key, v) {
  if (typeof v !== "number") return String(v);
  if (/ratio/i.test(key)) return (v * 100).toFixed(2) + "%";
  return v.toLocaleString("en-US");
}
let toastTimer = null;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
}
function copyText(text) {
  const done = () => toast("已复制链接到剪贴板");
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  } else fallbackCopy(text, done);
}
function fallbackCopy(text, done) {
  const ta = document.createElement("textarea");
  ta.value = text; ta.style.cssText = "position:fixed;opacity:0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); done(); } catch (e) { toast("复制失败，请手动复制"); }
  ta.remove();
}
function openUrl(url) { window.open(url, "_blank", "noopener"); }

/* ---------------- 主题（浅色 / 深色） ---------------- */
function currentTheme() { return document.documentElement.dataset.theme === "dark" ? "dark" : "light"; }
function cssVar(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}
/* 图表数据色板：渲染时从 CSS 变量取，切主题后重渲染即跟随 */
function seriesColors() {
  return ["--s1", "--s2", "--s3", "--s4", "--s5", "--s6", "--s7", "--s8"].map(cssVar);
}
function setTheme(t) {
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem("dh-theme", t); } catch (e) { /* 忽略 */ }
  const btn = document.getElementById("theme-btn");
  if (btn) {
    btn.textContent = t === "dark" ? "☀️" : "🌙";
    btn.title = t === "dark" ? "切换到浅色主题" : "切换到深色主题";
  }
}
function toggleTheme() {

  route();          // 重渲染当前视图：图表颜色在渲染时取 CSS 变量
}

/* 统一 API 请求：非 2xx 或返回 {error} 时抛出中文错误 */
async function api(path, opts) {
  let res;
  try { res = await fetch(path, opts); }
  catch (e) { throw new Error("网络错误：无法连接本地服务（" + e.message + "）"); }
  let body = null;
  try { body = await res.json(); } catch (e) { /* 非 JSON 响应 */ }
  if (!res.ok || (body && body.error)) {
    throw new Error((body && body.error) || ("请求失败（HTTP " + res.status + "）"));
  }
  return body;
}

/* ---------------- 数据加载（启动拉取一次，缓存内存） ---------------- */
function ensureData() {
  if (state.dataPromise) return state.dataPromise;
  state.dataPromise = Promise.all([
    api("/api/overview"), api("/api/datasets"), api("/api/glossary"),
    api("/api/hw1").catch(() => null),   // 实验聚合失败不阻塞门户主体
    api("/api/hw2").catch(() => null),
  ]).then(([ov, ds, gl, h1, h2]) => {
    state.overview = ov;
    state.datasets = ds.datasets;
    state.glossary = gl;
    state.hw1 = h1;
    state.hw2 = h2;
    state.byTerm = {};
    gl.terms.forEach(t => { state.byTerm[t.term] = t; });
    buildTermRegex();
    setNavStatus();
  }).catch(err => {
    state.dataError = err.message || String(err);
    state.dataPromise = null;
    throw err;
  });
  return state.dataPromise;
}

/* ---------------- 导航状态点 ---------------- */
function setNavStatus() {

  note.innerHTML = "AI 助手未启用：未检测到 <code>DEEPSEEK_API_KEY</code>。请在 <code>dataset_hub/.env</code> 中配置并重启服务，详见「架构说明」页。";
}

/* ---------------- 术语包裹（悬浮释义） ---------------- */
let termRegex = null;
function buildTermRegex() {
  const names = state.glossary.terms.map(t => t.term)
    .sort((a, b) => b.length - a.length).map(escRegExp);
  termRegex = new RegExp("(" + names.join("|") + ")", "g");
}
function isTermHit(text, start, end, term) {
  if (!/[^\u0000-ÿ]/.test(term)) {           // 纯 ASCII 词要求词边界
    const prev = start > 0 ? text[start - 1] : "";
    const next = end < text.length ? text[end] : "";
    if (prev && /[A-Za-z0-9-]/.test(prev)) return false;
    if (next && /[A-Za-z0-9]/.test(next)) return false;
  }
  return true;
}
function renderTerms(raw) {
  if (raw == null) return "";
  if (!termRegex) return esc(raw);
  let out = "", last = 0, m;
  termRegex.lastIndex = 0;
  while ((m = termRegex.exec(raw)) !== null) {
    const term = m[0], s = m.index, e = s + term.length;
    if (!isTermHit(raw, s, e, term)) continue;
    out += esc(raw.slice(last, s));
    out += '<span class="term" data-term="' + esc(term) + '" tabindex="0" role="button" aria-label="术语：' +
      esc(term) + '">' + esc(term) + "</span>";
    last = e;
  }
  out += esc(raw.slice(last));
  return out;
}

/* 术语悬浮卡（事件委托；鼠标悬停与键盘 focus 都支持） */
const tip = document.getElementById("term-tip");
function showTermTip(t) {
  const info = state.byTerm[t.dataset.term];
  if (!info) return;
  const def = info.def.length > 130 ? info.def.slice(0, 130) + "…" : info.def;
  tip.innerHTML = '<div class="tt-name">' + esc(info.term) +
    '<span class="tt-en"> · ' + esc(info.en || "") + '</span></div>' +
    '<div class="tt-def">' + esc(def) + '</div>' +
    '<div class="tt-go">点击 / 回车查看术语表 →</div>';
  tip.style.display = "block";
  const r = t.getBoundingClientRect();
  let x = Math.min(r.left, window.innerWidth - 340);
  let y = r.bottom + 8;
  if (y + 140 > window.innerHeight) y = r.top - 8 - tip.offsetHeight;
  tip.style.left = Math.max(8, x) + "px";
  tip.style.top = Math.max(8, y) + "px";
}
document.addEventListener("mouseover", e => {
  const t = e.target.closest && e.target.closest(".term");
  if (t) showTermTip(t);
});
document.addEventListener("mouseout", e => {
  if (e.target.closest && e.target.closest(".term")) tip.style.display = "none";
});
document.addEventListener("focusin", e => {
  const t = e.target.closest && e.target.closest(".term");
  if (t) showTermTip(t);
});
document.addEventListener("focusout", e => {
  if (e.target.closest && e.target.closest(".term")) tip.style.display = "none";
});
document.addEventListener("keydown", e => {
  if (e.key !== "Enter" && e.key !== " ") return;
  const t = e.target.closest && e.target.closest(".term");
  if (!t) return;
  e.preventDefault();
  location.hash = "#/glossary?term=" + encodeURIComponent(t.dataset.term);
});
document.addEventListener("click", e => {
  const t = e.target.closest(".term");
  if (t && state.byTerm[t.dataset.term]) {
    e.preventDefault();   // 术语在卡片 <a> 内时，阻止默认导航覆盖 hash
    e.stopPropagation();
    location.hash = "#/glossary?term=" + encodeURIComponent(t.dataset.term);
  }
});

function licenseShort(lic) {

/* 首页「实验观测」摘要卡（融合 hw1/hw2 实时状态） */
function expSummaryCards() {
  const card = (title, href, accent, rows, badge, pct) =>
    '<a class="card" href="' + href + '" style="border-top:3px solid ' + accent + '">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h3>' + title + "</h3>" + (badge || "") + "</div>" +
      rows.map(r => '<div class="muted" style="margin-top:4px">' + r + "</div>").join("") +
      (pct != null ? '<div class="prog" style="margin-top:10px" title="阶段完成度"><i style="width:' +
        Math.max(2, Math.min(100, pct)).toFixed(0) + '%"></i></div>' : "") +
      '<div style="margin-top:10px;color:var(--primary);font-size:13px">进入实验视图 →</div></a>';

  const h1 = state.hw1, h2 = state.hw2;
  let hw1Rows, hw1Badge = "", hw2Rows, hw2Badge = "", hw1Pct = null, hw2Pct = null;
  if (h1 && h1.runs && h1.runs.length) {
    const best = h1.runs.reduce((a, r) => (!a || r.best_val_dice > a.best_val_dice ? r : a), null);
    const fin = h1.runs.filter(r => r.status === "finished").length;
    const running = h1.runs.length - fin;
    const mainRuns = h1.runs.filter(r => runGroup(r.tag) === "main");
    const mainFin = mainRuns.filter(r => r.status === "finished").length;
    hw1Pct = h1.runs.length ? fin / h1.runs.length * 100 : 0;   // U7：首页卡补完成度细进度条
    hw1Badge = '<span class="badge ' + (running === 0 ? "done" : "running") + '">' +
      (running === 0 ? "主对比 " + mainFin + "/" + mainRuns.length : "运行中 " + running + " 个") + "</span>";
    hw1Rows = [
      "训练运行 " + h1.runs.length + " 个（主对比 " + mainRuns.length + "）· 最佳验证 Dice <b class='mono' style='color:var(--primary-dark)'>" + fmt3(best.best_val_dice) + "</b>（" + esc(best.tag) + "）",
      (running ? running + " 个运行进行中" : "全部运行已完成") + " · 权重文件 " + (h1.checkpoints || []).length + " 个",
    ];
  } else if (h1) {
    hw1Rows = ["暂无训练日志 —— 训练启动后此处的状态与曲线实时更新"];
  } else {
    hw1Rows = ["实验聚合暂不可用"];
  }
  if (h2) {
    const st = h2.stages || {};
    const e1 = st.e1 && st.e1.best_eval;
    const ids = ["e1", "e2", "e3"];
    const doneN = ids.filter(s => st[s] && st[s].status === "done").length;
    const runN = ids.filter(s => st[s] && st[s].status === "running").length;
    hw2Pct = doneN / 3 * 100;
    hw2Badge = '<span class="badge ' + (runN ? "running" : doneN ? "done" : "pending") + '">' +
      (runN ? "运行中 · " + doneN + "/3 阶段完成" : doneN + "/3 阶段完成") + "</span>";
    const pending = ids.filter(s => !st[s] || st[s].status === "pending")
      .map(s => s.toUpperCase()).join(" / ");
    const emb = h2.embeddings || {};
    const embVals = Object.values(emb);
    const embBytes = embVals.reduce((n, v) => n + (typeof v.size === "number" ? v.size : 0), 0);
    const embAll = embVals.length && embVals.every(v => v.pct >= 100);
    hw2Rows = [
      e1 ? "E1 零样本（GT 框提示）Dice <b class='mono' style='color:var(--primary-dark)'>" + fmt3(e1.dice) + "</b> · IoU " + fmt3(e1.iou) + " · HD95 " + fmt3(e1.hd95)
         : "E1 零样本评测尚未生成",
      (pending ? pending + " 待运行 · " : "") + "嵌入缓存 " + (embAll ? "已 100% 预计算" : "预计算中") +
        (embBytes ? "（" + fmtBytes(embBytes) + "）" : ""),
    ];
  } else {
    hw2Rows = ["实验聚合暂不可用"];
  }
  return card("作业 1 · 手写 U-Net 系列", "#/hw1", "var(--primary)", hw1Rows, hw1Badge, hw1Pct) +
         card("作业 2 · SAM 提示分割", "#/hw2", "#7c3aed", hw2Rows, hw2Badge, hw2Pct);
}

const STAT_LABELS = {
  train: "训练集", val: "验证集", test: "测试集", images: "图像总数", classes: "类别数",
  masks: "掩膜总数", fg_ratio_mean: "前景占比均值", empty_masks: "空掩膜数",
  multi_component: "多连通域样本", melanoma: "黑色素瘤", nevus: "痣",
  params_total: "总参数量", params_encoder: "编码器参数", params_decoder: "解码器参数",
  lora_trainable: "LoRA 可训练参数",
};
function srcClass(source) {
  const s = String(source || "");
  if (s.includes("镜像") || s.includes("mirror")) return "mirror";
  if (s.includes("官方") || s.includes("直链") || /official/i.test(s)) return "official";
  return "other";
}
let URLS = {};   // key: "dl-0" / "mir-1" → url（统一走映射，避免内联 onclick 引号转义问题）
function copyUrl(key) { if (URLS[key]) copyText(URLS[key]); }
function openByKey(key) { if (URLS[key]) openUrl(URLS[key]); }
function downloadRow(d, item, i, prefix) {
  const cls = srcClass(item.source);
  const badge = cls === "official" ? '<span class="src official">官方直链</span>'
    : cls === "mirror" ? '<span class="src mirror">镜像</span>'
    : '<span class="src other">' + esc(item.source) + '</span>';
  const key = prefix + "-" + i;
  return '<div class="dl-row">' +
    '<div class="dl-main">' +
      '<span class="dl-name">' + esc(item.name) + '</span>' +
      badge +
      '<span class="dl-meta">' + esc(item.format || "") + (item.format && item.size ? " · " : "") + esc(item.size || "") + '</span>' +
      '<span class="dl-btns">' +
        '<button class="btn sm" onclick="copyUrl(\'' + key + '\')">复制链接</button>' +
        '<button class="btn sm" onclick="openByKey(\'' + key + '\')">打开下载</button>' +
        '<button class="btn sm" id="' + prefix + '-btn-' + i + '" onclick="checkLink(\'' + prefix + '\',' + i + ',this)">检测</button>' +
      '</span>' +
    '</div>' +
    '<div class="dl-check" id="' + prefix + '-res-' + i + '"></div>' +
  '</div>';
}
const CHECK_CACHE = {};
async function checkLink(prefix, i, btn) {
  const url = URLS[prefix + "-" + i];
  const box = document.getElementById(prefix + "-res-" + i);
  if (!url || !box) return;
  const btnLabel = btn.textContent;
  btn.disabled = true;
  btn.textContent = "检测中…";   // U7：加载态 + 禁用，防连点生成多条结果
  box.className = "dl-check warn"; box.style.display = "block";
  box.textContent = "⏳ 正在探测（10 秒超时）…";
  const cacheKey = url;
  try {
    const r = CHECK_CACHE[cacheKey] || await api("/api/check_link?url=" + encodeURIComponent(url));
    CHECK_CACHE[cacheKey] = r;
    if (r.ok) {
      box.className = "dl-check ok";
      box.textContent = "🟢 可达 · HTTP " + r.status + (r.size_bytes ? " · 体积 " + fmtBytes(r.size_bytes) : "") + " · " + r.message;
    } else {
      box.className = "dl-check bad";
      box.textContent = "🔴 不可达 · " + r.message;
    }
  } catch (err) {
    box.className = "dl-check warn";
    box.textContent = "⚠️ 检测服务出错：" + err.message;
  } finally {
    btn.disabled = false;
    btn.textContent = btnLabel;
  }
}

function viewGlossary(query) {
  const target = query ? query.get("term") : null;
  if (target && state.byTerm[target]) { glossState.cat = "全部"; glossState.q = ""; }
  const cats = ["全部"].concat(state.glossary.categories || []);
  app.innerHTML =
    '<section class="view">' +
      '<div class="page-with-nav">' +
        '<aside class="page-nav" id="g-page-nav" aria-label="术语分类导航"></aside>' +
        '<div class="page-main">' +
      '<div class="sec-head" style="margin-top:4px"><h2>📖 术语表</h2>' +
      '<span style="font-size:13px;color:var(--text2)">共 ' + state.glossary.terms.length + ' 条 · 正文中的虚线词悬浮可看释义</span></div>' +
      '<div class="toolbar">' +
        '<div class="chiprow" id="g-chips">' +
          cats.map(c => '<button class="chip' + (c === glossState.cat ? " active" : "") + '" data-cat="' + esc(c) + '">' + esc(c) + '</button>').join("") +
        '</div>' +
        '<div class="search"><span class="ico">🔍</span>' +
          '<input id="g-search" type="search" placeholder="搜索术语 / 英文 / 定义…" value="' + esc(glossState.q) + '"></div>' +
      '</div>' +
      '<div id="g-list"></div>' +
        '</div>' +
      '</div>' +
    '</section>';

  const renderList = () => {
    const q = glossState.q.trim().toLowerCase();
    const match = t => (glossState.cat === "全部" || t.cat === glossState.cat) &&
      (!q || (t.term + " " + (t.en || "") + " " + t.def).toLowerCase().includes(q));
    const terms = state.glossary.terms.filter(match);
    const box = document.getElementById("g-list");
    if (!terms.length) {
      box.innerHTML = emptyBox("📖", "没有匹配的术语", "换个关键词，或清除筛选。") +
        '<div style="text-align:center"><button class="btn" onclick="resetGlossFilter()">清除筛选</button></div>';
      initPageNav("g-page-nav", []);   // 清空侧栏，避免残留死链
      return;
    }
    /* 按分类分组：声明顺序优先，未在 categories 中声明的分类兜底追加（防止数据漏声明时静默丢词条） */
    const groups = {};
    terms.forEach(t => { (groups[t.cat] = groups[t.cat] || []).push(t); });
    const declared = state.glossary.categories || [];
    const order = declared.concat(Object.keys(groups).filter(c => !declared.includes(c)));
    /* 锚点 id 清洗（HTML id 不允许空白字符），建 term → id 映射供跳转查询 */
    glossIds = {};
    /* 侧栏章节 = 当前可见的分类分组（随筛选/搜索联动重建） */
    const navSecs = [];
    box.innerHTML = order.filter(c => groups[c] && groups[c].length).map((c, gi) => {
      navSecs.push({ id: "gg-" + gi, num: String(gi + 1).padStart(2, "0"), label: c });
      return '<div class="g-group card" id="gg-' + gi + '" data-sec><h3 style="margin-bottom:4px">🏷️ ' + esc(c) +
        '<span style="font-weight:400;color:var(--text2);font-size:12.5px"> · ' + groups[c].length + ' 条</span></h3>' +
        groups[c].map(t => {
          const gid = "g-" + t.term.replace(/[^A-Za-z0-9一-鿿]+/g, "_");
          glossIds[t.term] = gid;
          return '<div class="g-term" id="' + gid + '">' +
            '<div class="head"><span class="name">' + esc(t.term) + '</span>' +
              '<span class="en">' + esc(t.en || "") + '</span><span class="tag cat">' + esc(t.cat) + '</span></div>' +
            '<div class="def">' + esc(t.def) + '</div>' +
            (t.formula ? '<div class="formula">' + esc(t.formula) + '</div>' : "") +
          '</div>';
        }).join("") +
      '</div>';
    }).join("");   // 外层 map 必须 join：数组直接赋 innerHTML 会按逗号拼接，把「,」渲染成真实文本
    if (target && state.byTerm[target] && glossIds[target]) {
      const el = document.getElementById(glossIds[target]);
      if (el) {
        el.scrollIntoView({ block: "center" });
        el.classList.add("flash");
      }
    }
    initPageNav("g-page-nav", navSecs);   // 分类随筛选/搜索联动重建侧栏
  };
  renderList();

  document.getElementById("g-chips").addEventListener("click", e => {
    const b = e.target.closest(".chip"); if (!b) return;
    glossState.cat = b.dataset.cat;
    document.querySelectorAll("#g-chips .chip").forEach(c =>
      c.classList.toggle("active", c.dataset.cat === glossState.cat));
    renderList();
  });
  document.getElementById("g-search").addEventListener("input", e => {
    glossState.q = e.target.value; renderList();
  });
}
function resetGlossFilter() {
  glossState.cat = "全部"; glossState.q = ""; viewGlossary(null);
}

const SPLIT_CN = { train: "训练集", val: "验证集", test: "测试集" };

/* ==================== 图表引擎（对标 Grafana · 纯 SVG · 无依赖） ====================
 * 特性：nice 刻度 / 面积渐变 / 平滑曲线 / 悬停十字线 + 共享 tooltip /
 *       图例可点击隐藏 / 阈值参考线 / 末值标注 / 主题自适应（颜色取自 CSS 变量）
 * 用法：gchart([{name, pts:[[x,y],…], color?}], {h, yLabel, xLabel, smooth, area, threshold}) */
const CHARTS = {};
let chartSeq = 0;

/* 把区间切成「好看」的刻度：步长取 1/2/5 × 10^n */
function niceTicks(lo, hi, want) {
  if (!(hi > lo)) { hi = lo + 1; }
  const raw = (hi - lo) / Math.max(1, want);
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const n = raw / mag;
  const step = (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * mag;
  const start = Math.ceil(lo / step) * step;
  const ticks = [];
  for (let v = start; v <= hi + step * 1e-6; v += step) ticks.push(Number(v.toPrecision(12)));
  return { ticks: ticks, step: step };
}
function fmtNum(v, step) {
  const a = Math.abs(v);
  if (a >= 1e6) return (v / 1e6).toFixed(1) + "M";
  if (a >= 1e4) return (v / 1e3).toFixed(0) + "k";
  if (a >= 1e3 && step >= 100) return (v / 1e3).toFixed(1) + "k";
  if (a !== 0 && a < 1e-4) return v.toExponential(1);   // 学习率等极小值用科学计数，避免全被四舍五入成 0.000
  const d = step >= 1 ? 0 : step >= 0.1 ? 1 : step >= 0.01 ? 2 : step >= 0.001 ? 3 : 4;
  return v.toFixed(d);
}
/* Catmull-Rom → 三次贝塞尔：比折线柔和，又不会像样条那样过冲 */
function smoothPath(pts, tension) {
  if (pts.length < 3) return "M" + pts.map(p => p[0] + "," + p[1]).join(" L");
  const t = tension == null ? 0.18 : tension;
  let d = "M" + pts[0][0] + "," + pts[0][1];
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    const c1x = p1[0] + (p2[0] - p0[0]) * t, c1y = p1[1] + (p2[1] - p0[1]) * t;
    const c2x = p2[0] - (p3[0] - p1[0]) * t, c2y = p2[1] - (p3[1] - p1[1]) * t;
    d += " C" + c1x.toFixed(1) + "," + c1y.toFixed(1) + " " + c2x.toFixed(1) + "," +
         c2y.toFixed(1) + " " + p2[0].toFixed(1) + "," + p2[1].toFixed(1);
  }
  return d;
}

function gchart(series, opt) {
  const id = "gc" + (++chartSeq);
  CHARTS[id] = {
    series: series.map(s => ({ name: s.name, pts: s.pts.slice(), color: s.color })),
    opt: opt || {}, hidden: series.map(() => false), hoverX: null,
  };
  return '<div class="gchart" data-chart="' + id + '">' + chartSVG(id) + "</div>";
}

function chartSVG(id) {
  const st = CHARTS[id], opt = st.opt;
  const pal = seriesColors();
  st.series.forEach((s, i) => { if (!s.color) s.color = pal[i % pal.length]; });
  const vis = st.series.filter((s, i) => !st.hidden[i] && s.pts.length);
  if (!vis.length) {
    return '<div class="chart-legend">' + chartLegend(id) + "</div>" +
      '<div class="empty" style="padding:26px"><div class="emoji">📈</div>没有可显示的序列</div>';
  }
  /* 宽度跟随容器（ResizeObserver 重算后重绘），保证 x/y 等比、文字不失真 */
  const w = st.width || 720, h = opt.h || 260, pl = 56, pr = 18, pt = 26, pb = 36;
  const xs = [].concat.apply([], vis.map(s => s.pts.map(p => p[0])));
  const ys = [].concat.apply([], vis.map(s => s.pts.map(p => p[1])));
  let x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs);
  let y0 = Math.min.apply(null, ys), y1 = Math.max.apply(null, ys);
  if (opt.yMin != null) y0 = Math.min(y0, opt.yMin);
  if (opt.yMax != null) y1 = Math.max(y1, opt.yMax);
  /* 阈值参考线要可见：把它的取值纳入 y 轴范围 */
  if (opt.threshold && typeof opt.threshold.value === "number") {
    y0 = Math.min(y0, opt.threshold.value);
    y1 = Math.max(y1, opt.threshold.value);
  }
  if (x0 === x1) { x0 -= 1; x1 += 1; }
  if (y0 === y1) { y0 -= 0.5; y1 += 0.5; }
  const pad = (y1 - y0) * 0.1; y0 -= pad; y1 += pad;
  if (opt.yMin != null) y0 = opt.yMin;
  if (opt.yMax != null) y1 = opt.yMax;
  const X = v => pl + (v - x0) / (x1 - x0) * (w - pl - pr);
  const Y = v => pt + (1 - (v - y0) / (y1 - y0)) * (h - pt - pb);
  st.geom = { X: X, Y: Y, x0: x0, x1: x1, w: w, h: h, pl: pl, pt: pt, pb: pb, pr: pr };

  /* y 轴网格 + 刻度 */
  const tk = niceTicks(y0, y1, 5);
  let grid = "";
  tk.ticks.forEach(v => {
    if (v < y0 || v > y1) return;
    const yy = Y(v).toFixed(1);
    grid += '<line x1="' + pl + '" y1="' + yy + '" x2="' + (w - pr) + '" y2="' + yy + '" style="stroke:var(--chart-grid)" stroke-width="1"/>';
    grid += '<text class="c-tick" x="' + (pl - 9) + '" y="' + (Number(yy) + 4) + '" text-anchor="end">' + fmtNum(v, tk.step) + "</text>";
  });
  /* x 轴刻度：类别轴优先（opt.xTicks），否则用 nice 刻度 */
  let xlab = "";
  if (Array.isArray(opt.xTicks) && opt.xTicks.length) {
    opt.xTicks.forEach((label, i) => {
      if (i < x0 || i > x1) return;
      xlab += '<text class="c-tick" x="' + X(i).toFixed(1) + '" y="' + (h - pb + 18) + '" text-anchor="middle">' + esc(label) + "</text>";
    });
  } else {
    const xt = niceTicks(x0, x1, 6);
    xt.ticks.forEach(v => {
      if (v < x0 || v > x1) return;
      xlab += '<text class="c-tick" x="' + X(v).toFixed(1) + '" y="' + (h - pb + 18) + '" text-anchor="middle">' + fmtNum(v, xt.step) + "</text>";
    });
  }
  /* 面积渐变 defs */
  let defs = "<defs>";
  vis.forEach((s, i) => {
    defs += '<linearGradient id="' + id + "g" + i + '" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0%" stop-color="' + s.color + '" stop-opacity="' + cssVar("--chart-area") + '"/>' +
      '<stop offset="100%" stop-color="' + s.color + '" stop-opacity="0"/></linearGradient>';
  });
  defs += "</defs>";
  /* 阈值参考线 */
  let thr = "";
  if (opt.threshold && opt.threshold.value >= y0 && opt.threshold.value <= y1) {
    const ty = Y(opt.threshold.value).toFixed(1);
    thr = '<line x1="' + pl + '" y1="' + ty + '" x2="' + (w - pr) + '" y2="' + ty +
      '" style="stroke:' + (opt.threshold.color || "var(--accent)") + '" stroke-width="1.4" stroke-dasharray="6 4" opacity=".85"/>' +
      '<text class="c-tick" x="' + (w - pr - 2) + '" y="' + (Number(ty) - 5) + '" text-anchor="end" style="fill:' +
      (opt.threshold.color || "var(--accent)") + '">' + esc(opt.threshold.label || "") + "</text>";
  }
  /* 数据系列：面积 + 曲线 + 末值点 */
  let body = "";
  vis.forEach((s, i) => {
    const P = s.pts.map(p => [X(p[0]), Y(p[1])]);
    const line = opt.smooth === false
      ? "M" + P.map(p => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" L")
      : smoothPath(P.map(p => [Number(p[0].toFixed(1)), Number(p[1].toFixed(1))]));
    /* 序列多于 3 条时不铺面积：多条半透明面积叠加会把曲线糊成一片 */
    const withArea = opt.area === true || (opt.area !== false && vis.length <= 3);
    if (s.pts.length > 1 && withArea) {
      body += '<path d="' + line + " L" + P[P.length - 1][0].toFixed(1) + "," + (h - pb) +
        " L" + P[0][0].toFixed(1) + "," + (h - pb) + ' Z" fill="url(#' + id + "g" + i + ')"/>';
    }
    body += '<path d="' + line + '" fill="none" stroke="' + s.color +
      '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
    const last = P[P.length - 1];
    body += '<circle cx="' + last[0].toFixed(1) + '" cy="' + last[1].toFixed(1) +
      '" r="3.2" fill="' + s.color + '" stroke="var(--card)" stroke-width="1.5"/>';
    if (s.pts.length === 1) {
      body += '<circle cx="' + P[0][0].toFixed(1) + '" cy="' + P[0][1].toFixed(1) + '" r="4" fill="' + s.color + '"/>';
    }
  });
  const yLab = opt.yLabel ? '<text class="c-axlabel" x="4" y="11" text-anchor="start">' + esc(opt.yLabel) + "</text>" : "";
  const xLab = opt.xLabel ? '<text class="c-axlabel" x="' + (w - pr) + '" y="' + (h - 2) + '" text-anchor="end">' + esc(opt.xLabel) + "</text>" : "";
  return '<div class="chart-legend">' + chartLegend(id) + "</div>" +
    '<svg class="gc-svg" viewBox="0 0 ' + w + " " + h + '" preserveAspectRatio="xMidYMid meet" style="width:100%;height:' + h + 'px;display:block;overflow:visible">' +
      defs + grid + thr +
      '<line x1="' + pl + '" y1="' + (h - pb) + '" x2="' + (w - pr) + '" y2="' + (h - pb) + '" style="stroke:var(--chart-axis)"/>' +
      xlab + body +
      '<g class="gc-hover" style="display:none">' +
        '<line class="gc-cross" y1="' + pt + '" y2="' + (h - pb) + '" style="stroke:var(--chart-axis)" stroke-width="1" stroke-dasharray="3 3"/>' +
      "</g>" +
      yLab + xLab +
    "</svg>" +
    '<div class="gc-tip"></div>';
}
function chartLegend(id) {
  const st = CHARTS[id];
  return st.series.map((s, i) =>
    '<button class="lg' + (st.hidden[i] ? " off" : "") + '" data-chart="' + id + '" data-i="' + i + '">' +
      '<span class="dot" style="background:' + (s.color || seriesColors()[i % 8]) + '"></span>' + esc(s.name) + "</button>").join("");
}
function toggleSeries(id, i) {
  const st = CHARTS[id];
  if (!st) return;
  st.hidden[i] = !st.hidden[i];
  const wrap = document.querySelector('.gchart[data-chart="' + id + '"]');
  if (!wrap) return;
  const legendHtml = chartLegend(id);
  wrap.innerHTML = chartSVG(id);
  // 图例位置在 SVG 之前，chartSVG 已重新生成，这里无需额外处理
}
function rerenderCharts() {
  Object.keys(CHARTS).forEach(id => {
    const wrap = document.querySelector('.gchart[data-chart="' + id + '"]');
    if (wrap) wrap.innerHTML = chartSVG(id);
  });
}

/* ---- 悬停：十字线 + 共享 tooltip（事件委托，视图重渲染后依然有效） ---- */
function chartHover(e) {
  const wrap = e.target.closest ? e.target.closest(".gchart") : null;
  if (!wrap) { hideChartTips(); return; }
  const st = CHARTS[wrap.dataset.chart];
  if (!st || !st.geom) return;
  const svg = wrap.querySelector("svg.gc-svg");
  const tip = wrap.querySelector(".gc-tip");
  if (!svg || !tip) return;
  const r = svg.getBoundingClientRect();
  if (!r.width) return;
  const g = st.geom;
  const mx = (e.clientX - r.left) / r.width * g.w;
  /* 在所有可见序列的 x 里找最近的 */
  const vis = st.series.filter((s, i) => !st.hidden[i] && s.pts.length);
  if (!vis.length) return;
  let best = null, bestD = Infinity;
  vis.forEach(s => s.pts.forEach(p => {
    const d = Math.abs(g.X(p[0]) - mx);
    if (d < bestD) { bestD = d; best = p[0]; }
  }));
  if (best == null) return;
  st.hoverX = best;
  const cx = g.X(best);
  const hov = wrap.querySelector(".gc-hover");
  hov.style.display = "";
  hov.querySelector(".gc-cross").setAttribute("x1", cx.toFixed(1));
  hov.querySelector(".gc-cross").setAttribute("x2", cx.toFixed(1));
  /* 每个序列在该 x 的取值（取最近点） */
  const rows = vis.map(s => {
    let pt = null, d = Infinity;
    s.pts.forEach(p => { const dd = Math.abs(p[0] - best); if (dd < d) { d = dd; pt = p; } });
    return { name: s.name, color: s.color, x: pt[0], y: pt[1] };
  });
  const step = (niceTicks(g.x0, g.x1, 6).step) || 1;
  tip.innerHTML = '<div class="tip-x">' + esc(st.opt.xLabel || "轮次") + " = " + fmtNum(best, step) + "</div>" +
    rows.map(r2 => '<div class="tip-row"><span class="dot" style="background:' + r2.color + '"></span>' +
      "<span class='tip-n'>" + esc(r2.name) + "</span><b>" + fmtNum(r2.y, 0.001) + "</b></div>").join("");
  tip.style.display = "block";
  tipVisible = true;
  const px = cx / g.w * r.width;
  tip.style.left = Math.max(4, Math.min(r.width - tip.offsetWidth - 4, px + 12)) + "px";
  tip.style.top = "8px";
  /* 高亮圆点 */
  let dots = "";
  rows.forEach(r2 => { dots += '<circle cx="' + g.X(r2.x).toFixed(1) + '" cy="' + g.Y(r2.y).toFixed(1) + '" r="3.6" fill="' + r2.color + '" stroke="var(--card)" stroke-width="1.5"/>'; });
  let dotG = hov.querySelector(".gc-dots");
  if (!dotG) { dotG = document.createElementNS("http://www.w3.org/2000/svg", "g"); dotG.setAttribute("class", "gc-dots"); hov.appendChild(dotG); }
  dotG.innerHTML = dots;
}
let tipVisible = false;
function hideChartTips() {
  if (!tipVisible) return;                 // 未显示时直接返回：mousemove 高频触发，避免每次全文档查询
  tipVisible = false;
  document.querySelectorAll(".gchart .gc-tip").forEach(t => { t.style.display = "none"; });
  document.querySelectorAll(".gchart .gc-hover").forEach(t => { t.style.display = "none"; });
}
document.addEventListener("mousemove", chartHover);
/* 只有指针真正离开图表容器才隐藏；用 mouseout + relatedTarget 判断，
 * 否则在图表内部元素之间移动会不断触发 mouseleave 导致 tooltip 闪烁 */
document.addEventListener("mouseout", e => {

  if (!wrap) return;
