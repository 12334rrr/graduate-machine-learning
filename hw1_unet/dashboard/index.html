<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>作业1 · 医学图像分割监控台</title>
<style>
:root{
  --bg:#0d1117; --bg2:#151b24; --bg3:#1c2431; --line:#2a3444;
  --txt:#e6edf3; --txt2:#9aa7b8; --txt3:#65728a;
  --accent:#4f8cff; --green:#3fb950; --red:#f85149; --orange:#d29922; --purple:#bc8cff; --teal:#39c5cf;
  --mono:"SF Mono",Menlo,"Courier New",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;display:flex;min-height:100vh}
/* ---------- 侧边栏 ---------- */
aside{width:212px;min-width:212px;background:var(--bg2);border-right:1px solid var(--line);padding:18px 0;position:sticky;top:0;height:100vh;overflow-y:auto}
.logo{padding:0 18px 16px;border-bottom:1px solid var(--line)}
.logo b{font-size:15px;display:block}
.logo span{font-size:11px;color:var(--txt3)}
nav a{display:flex;align-items:center;gap:9px;padding:10px 18px;color:var(--txt2);text-decoration:none;font-size:13.5px;border-left:3px solid transparent}
nav a:hover{background:var(--bg3);color:var(--txt)}
nav a.on{color:var(--accent);border-left-color:var(--accent);background:var(--bg3)}
nav a .ico{width:17px;text-align:center}
.env{margin:14px 18px;padding:9px 11px;background:var(--bg3);border-radius:8px;font-size:11px;color:var(--txt3)}
.env code{color:var(--teal);font-family:var(--mono);font-size:10.5px}
/* ---------- 主区 ---------- */
main{flex:1;padding:0 26px 40px;min-width:0}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 0 14px;border-bottom:1px solid var(--line);margin-bottom:20px;position:sticky;top:0;background:var(--bg);z-index:5}
header h1{font-size:17px;font-weight:600}
header p{font-size:12px;color:var(--txt2);margin-top:3px}
.hud{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--txt3)}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block;animation:p 1.6s infinite}
@keyframes p{0%,100%{opacity:1}50%{opacity:.25}}
/* ---------- 卡片与网格 ---------- */
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:16px}
.card h3{font-size:12px;color:var(--txt2);font-weight:500;margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
.stat .v{font-size:26px;font-weight:700;font-family:var(--mono)}
.stat .s{font-size:11.5px;color:var(--txt3);margin-top:3px}
.sec{margin-bottom:22px}
.sec>h2{font-size:15px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;font-family:var(--mono)}
.t-run{background:rgba(63,185,80,.15);color:var(--green)}
.t-fin{background:rgba(101,114,138,.2);color:var(--txt2)}
.t-best{background:rgba(210,153,34,.15);color:var(--orange)}
/* ---------- 表格 ---------- */
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{color:var(--txt3);font-weight:500;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid rgba(42,52,68,.5);font-family:var(--mono);white-space:nowrap}
tr:hover td{background:var(--bg3)}
td.plain,th.plain{font-family:inherit}
a{color:var(--accent);text-decoration:none}
/* ---------- 进度条 ---------- */
.bar{height:6px;background:var(--bg3);border-radius:3px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--teal));border-radius:3px;transition:width .5s}
.bar.fin i{background:var(--green)}
/* ---------- 图表 ---------- */
.chart{width:100%}
.chart svg{width:100%;display:block}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--txt2);margin-top:6px;flex-wrap:wrap}
.legend i{width:10px;height:3px;display:inline-block;border-radius:2px;margin-right:5px;vertical-align:middle}
/* ---------- 代码 ---------- */
.codebox{background:#0a0e14;border:1px solid var(--line);border-radius:8px;overflow:auto;max-height:65vh}
.codebox pre{font-family:var(--mono);font-size:12px;line-height:1.6;padding:12px 0;counter-reset:l}
.codebox pre span{display:block;padding:0 14px 0 0;white-space:pre}
.codebox pre span::before{counter-increment:l;content:counter(l);display:inline-block;width:44px;text-align:right;margin-right:14px;color:var(--txt3);user-select:none;border-right:1px solid var(--line);padding-right:8px}
.filelist{max-height:65vh;overflow-y:auto}
.filelist a{display:block;padding:7px 10px;border-radius:6px;color:var(--txt2);font-family:var(--mono);font-size:12px}
.filelist a:hover,.filelist a.on{background:var(--bg3);color:var(--accent)}
/* ---------- markdown ---------- */
.md{line-height:1.8;font-size:13.5px;max-width:900px}
.md h1,.md h2,.md h3{margin:18px 0 8px;border-bottom:1px solid var(--line);padding-bottom:5px}
.md h1{font-size:19px}.md h2{font-size:16px}.md h3{font-size:14px}
.md code{background:var(--bg3);padding:1px 5px;border-radius:4px;font-family:var(--mono);font-size:12px;color:var(--teal)}
.md pre{background:#0a0e14;padding:12px;border-radius:8px;overflow:auto;margin:8px 0}
.md pre code{background:none;padding:0}
.md table{margin:10px 0}.md img{max-width:100%;border-radius:8px;border:1px solid var(--line)}
.md blockquote{border-left:3px solid var(--accent);padding-left:12px;color:var(--txt2);margin:8px 0}
/* ---------- 详情抽屉 ---------- */
#drawer{position:fixed;right:-720px;top:0;width:700px;height:100vh;background:var(--bg2);border-left:1px solid var(--line);transition:right .25s;z-index:20;overflow-y:auto;padding:22px;box-shadow:-12px 0 40px rgba(0,0,0,.5)}
#drawer.open{right:0}
#drawer .close{float:right;cursor:pointer;color:var(--txt3);font-size:18px;padding:2px 8px;border-radius:6px}
#drawer .close:hover{background:var(--bg3);color:var(--txt)}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;font-size:12.5px;margin:12px 0}
.kv b{color:var(--txt3);font-weight:500}
.muted{color:var(--txt3)} .ok{color:var(--green)} .warn{color:var(--orange)}
.btn{display:inline-block;padding:5px 12px;border-radius:6px;border:1px solid var(--line);background:var(--bg3);color:var(--txt);font-size:12px;cursor:pointer}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.imgs figure{background:var(--bg3);border-radius:8px;padding:8px}
.imgs img{width:100%;border-radius:5px;display:block}
.imgs figcaption{font-size:11px;color:var(--txt2);margin-top:5px;font-family:var(--mono);word-break:break-all}
</style>
</head>
<body>
<aside>
  <div class="logo"><b>🔬 HW1 · MedSeg</b><span>手写 U-Net 系列 · ISIC 2018</span></div>
  <nav id="nav">
    <a href="#overview" data-v="overview" class="on"><span class="ico">📊</span>运行概览</a>
    <a href="#monitor" data-v="monitor"><span class="ico">📈</span>训练监控</a>
    <a href="#history" data-v="history"><span class="ico">🗂</span>历史记录</a>
    <a href="#code" data-v="code"><span class="ico">💻</span>代码浏览</a>
    <a href="#models" data-v="models"><span class="ico">⬇️</span>模型与产物</a>
    <a href="#reports" data-v="reports"><span class="ico">📄</span>报告文档</a>
  </nav>
  <div class="env">conda 环境<br><code>hw1-unet-medseg</code><br><br>设备<br><code id="dev">Apple M5 · MPS fp16</code></div>
</aside>
<main>
  <header>
    <div><h1 id="ptitle">作业 1 · 医学图像分割</h1><p id="psub">加载中…</p></div>
    <div class="hud"><span><span class="pulse"></span> 实时刷新 5s</span><span id="clock"></span></div>
  </header>
  <div id="view"></div>
</main>
<div id="drawer"></div>

<script>
/* ================= 工具 ================= */
const $=s=>document.querySelector(s);
const fmt=(v,d=4)=>v===null||v===undefined||Number.isNaN(v)?"—":(+v).toFixed(d);
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
let STATE=null, VIEW="overview", SEL_RUN=null;

/* ================= 极简 SVG 折线图 ================= */
function lineChart(el,series,opts={}){
  const W=el.clientWidth||600,H=opts.h||230,P={l:46,r:12,t:14,b:26};
  const all=series.flatMap(s=>s.data.map(p=>p.y)).filter(v=>v!=null&&!isNaN(v));
  if(!all.length){el.innerHTML='<p class="muted" style="padding:20px">暂无数据</p>';return}
  let ymin=Math.min(...all),ymax=Math.max(...all);
  if(ymin===ymax){ymin-=0.01;ymax+=0.01}
  const pad=(ymax-ymin)*0.08;ymin-=pad;ymax+=pad;
  const xmax=Math.max(...series.flatMap(s=>s.data.map(p=>p.x)),1);
  const X=x=>P.l+(x/xmax)*(W-P.l-P.r), Y=y=>P.t+(1-(y-ymin)/(ymax-ymin))*(H-P.t-P.b);
  let g="";
  for(let i=0;i<=4;i++){const yv=ymin+(ymax-ymin)*i/4,y=Y(yv);
    g+=`<line x1="${P.l}" y1="${y}" x2="${W-P.r}" y2="${y}" stroke="#2a3444" stroke-width="1"/>
        <text x="${P.l-7}" y="${y+3.5}" fill="#65728a" font-size="10" text-anchor="end">${yv.toFixed(3)}</text>`}
  const step=Math.ceil(xmax/10);
  for(let x=0;x<=xmax;x+=step){g+=`<text x="${X(x)}" y="${H-8}" fill="#65728a" font-size="10" text-anchor="middle">${x}</text>`}
  series.forEach(s=>{
    const pts=s.data.filter(p=>p.y!=null&&!isNaN(p.y));
    if(!pts.length)return;
    const d=pts.map((p,i)=>`${i?"L":"M"}${X(p.x).toFixed(1)},${Y(p.y).toFixed(1)}`).join(" ");
    g+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="1.8" stroke-linejoin="round"/>`;
    const lastPt=pts[pts.length-1];
    g+=`<circle cx="${X(lastPt.x)}" cy="${Y(lastPt.y)}" r="3" fill="${s.color}"/>`;
  });
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" class="chart">${g}</svg>
    <div class="legend">${series.map(s=>`<span><i style="background:${s.color}"></i>${s.name}</span>`).join("")}</div>`;
}

/* ================= 极简 Markdown ================= */
function md(src){
  src=esc(src);
  src=src.replace(/```(\w*)\n([\s\S]*?)```/g,(m,l,c)=>`<pre><code>${c}</code></pre>`);
  src=src.replace(/`([^`]+)`/g,"<code>$1</code>");
  // 表格
  src=src.replace(/((?:^\|.*\|\s*$\n?)+)/gm,block=>{
    const rows=block.trim().split("\n").map(r=>r.trim().replace(/^\||\|$/g,"").split("|").map(c=>c.trim()));
    if(rows.length<2)return block;
    let h="<table><thead><tr>"+rows[0].map(c=>`<th class="plain">${c}</th>`).join("")+"</tr></thead><tbody>";
    rows.slice(1).forEach((r,i)=>{if(i===0&&/^[-: ]+$/.test(r.join("")))return;
      h+="<tr>"+r.map(c=>`<td class="plain">${c}</td>`).join("")+"</tr>"});
    return h+"</tbody></table>";
  });
  src=src.replace(/^###### (.*)$/gm,"<h4>$1</h4>").replace(/^##### (.*)$/gm,"<h4>$1</h4>")
    .replace(/^#### (.*)$/gm,"<h4>$1</h4>").replace(/^### (.*)$/gm,"<h3>$1</h3>")
    .replace(/^## (.*)$/gm,"<h2>$1</h2>").replace(/^# (.*)$/gm,"<h1>$1</h1>");
  src=src.replace(/^&gt; (.*)$/gm,"<blockquote>$1</blockquote>");
  src=src.replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/^---$/gm,"<hr style='border-color:var(--line)'>");
  src=src.replace(/!\[([^\]]*)\]\(([^)]+)\)/g,'<img alt="$1" src="$2">');
  src=src.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2">$1</a>');
  src=src.split(/\n{2,}/).map(b=>/^<(h\d|table|pre|blockquote|ul|hr)/.test(b.trim())?b:`<p>${b.replace(/\n/g,"<br>")}</p>`).join("\n");
  return `<div class="md">${src}</div>`;
}

/* ================= 视图 ================= */
function statusTag(r){return r.status==="running"?'<span class="tag t-run">● 运行中</span>':'<span class="tag t-fin">已完成</span>'}
function progBar(r){
  const tot=r.total_epochs||30,pct=Math.min(100,(r.epochs_done/tot*100));
  return `<div style="display:flex;align-items:center;gap:8px"><div class="bar ${r.status!=="running"?"fin":""}" style="flex:1"><i style="width:${pct}%"></i></div><span class="muted" style="font-size:11px">${r.epochs_done}/${tot}</span></div>`;
}

function vOverview(){
  const runs=STATE.runs,running=runs.filter(r=>r.status==="running"),fin=runs.filter(r=>r.status!=="running");
  const best=runs.length?runs.reduce((a,b)=>a.best_val_dice>b.best_val_dice?a:b):null;
  const ev=STATE.evals;
  const ds=STATE.data_stats;
  let h=`<div class="sec"><div class="grid g4">
    <div class="card stat"><h3>实验运行总数</h3><div class="v">${runs.length}</div><div class="s">训练 + 消融</div></div>
    <div class="card stat"><h3>进行中</h3><div class="v" style="color:var(--green)">${running.length}</div><div class="s">${running.map(r=>r.tag).join(", ")||"无"}</div></div>
    <div class="card stat"><h3>已完成</h3><div class="v">${fin.length}</div><div class="s">含测试评测 ${ev.length} 份</div></div>
    <div class="card stat"><h3>最佳 Val Dice</h3><div class="v" style="color:var(--orange)">${best?fmt(best.best_val_dice):"—"}</div><div class="s">${best?best.tag:"—"}</div></div>
  </div></div>`;
  if(running.length){
    h+=`<div class="sec"><h2>⚡ 正在运行</h2><div class="grid g2">`+running.map(r=>`
      <div class="card"><div style="display:flex;justify-content:space-between;margin-bottom:8px">
        <b style="font-family:var(--mono)">${r.tag}</b>${statusTag(r)}</div>
        ${progBar(r)}
        <div class="kv" style="margin-top:10px">
          <b>累计时长</b><span>${fmt(r.cum_min,1)} min</span>
          <b>当前 val Dice</b><span>${fmt(r.last.dice)}</span>
          <b>当前 train_loss</b><span>${fmt(r.last.train_loss)}</span>
          <b>学习率</b><span>${fmt(r.last.lr,6)}</span>
        </div></div>`).join("")+`</div></div>`;
  }
  h+=`<div class="sec"><h2>📋 数据集概况（ISIC 2018 Task 1）</h2><div class="card">`;
  if(ds){
    h+=`<div class="grid g4">`+["train","val","test"].map(s=>{
      const d=ds[s];if(!d)return "";
      return `<div><h3>${s.toUpperCase()}</h3><div class="v" style="font-size:20px">${d.count}</div>
        <div class="s">前景像素占比均值 ${fmt(d.fg_ratio_mean*100,2)}%<br>空掩膜 ${d.empty_masks} · 多连通域 ${d.multi_component}</div></div>`;
    }).join("")+`</div><p class="muted" style="margin-top:10px;font-size:12px">完整统计见「报告文档 → data_stats.md」</p>`;
  }else h+=`<p class="muted">数据统计尚未生成（prepare_data.py 运行后自动出现）</p>`;
  h+=`</div></div>`;
  h+=`<div class="sec"><h2>🏆 测试集评测结果</h2><div class="card">${evalTable(ev)}</div></div>`;
  h+=`<div class="sec"><h2>🕒 最近运行</h2><div class="card">${runTable(runs.slice(-8).reverse())}</div></div>`;
  return h;
}

function evalTable(ev){
  if(!ev.length)return '<p class="muted">暂无测试集评测结果</p>';
  return `<table><thead><tr><th class="plain">实验</th><th>Dice</th><th>IoU</th><th>HD95</th><th>Sens</th><th>Spec</th><th>PixAcc</th><th class="plain">时间</th></tr></thead><tbody>`+
    ev.map(e=>`<tr><td class="plain"><b>${e.tag||e._file}</b></td><td>${fmt(e.dice)}</td><td>${fmt(e.iou)}</td>
      <td>${fmt(e.hd95,2)}</td><td>${fmt(e.sensitivity)}</td><td>${fmt(e.specificity)}</td>
      <td>${fmt(e.pixel_acc)}</td><td class="plain muted">${e.time||""}</td></tr>`).join("")+`</tbody></table>`;
}
function runTable(runs){
  if(!runs.length)return '<p class="muted">暂无运行记录</p>';
  return `<table><thead><tr><th class="plain">实验标识</th><th class="plain">模型</th><th>Seed</th><th>Epoch</th><th>Best Dice</th><th>时长(min)</th><th class="plain">状态</th><th class="plain">更新</th></tr></thead><tbody>`+
    runs.map(r=>`<tr style="cursor:pointer" onclick="openRun('${r.tag}')">
      <td class="plain"><b>${r.tag}</b>${r.has_eval?' <span class="tag t-best">已评测</span>':""}</td>
      <td class="plain">${r.model}</td><td>${r.seed??"—"}</td><td>${r.epochs_done}</td>
      <td>${fmt(r.best_val_dice)}</td><td>${fmt(r.cum_min,1)}</td>
      <td class="plain">${statusTag(r)}</td><td class="plain muted">${r.updated}</td></tr>`).join("")+`</tbody></table>`;
}

function vMonitor(){
  const runs=STATE.runs;
  if(!runs.length)return '<div class="card"><p class="muted">暂无训练数据</p></div>';
  if(!SEL_RUN||!runs.find(r=>r.tag===SEL_RUN))SEL_RUN=runs[runs.length-1].tag;
  const r=runs.find(x=>x.tag===SEL_RUN);
  const s=r.series;
  const toSeries=(key,name,color)=>({name,color,data:s.map(row=>({x:row.epoch,y:row[key]}))});
  let h=`<div class="sec"><div class="card" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
    <b>选择运行：</b>`+runs.map(x=>`<span class="btn" style="${x.tag===SEL_RUN?"border-color:var(--accent);color:var(--accent)":""}" onclick="SEL_RUN='${x.tag}';render()">${x.tag}</span>`).join("")+`</div></div>
    <div class="sec"><div class="card"><div style="display:flex;justify-content:space-between;margin-bottom:10px">
      <h3 style="margin:0">${r.tag} ${statusTag(r)}</h3><span class="muted">累计 ${fmt(r.cum_min,1)} min</span></div>
      ${progBar(r)}</div></div>
    <div class="sec grid g2">
      <div class="card"><h3>损失曲线</h3><div id="c1"></div></div>
      <div class="card"><h3>验证集 Dice / IoU</h3><div id="c2"></div></div>
      <div class="card"><h3>Sensitivity / Specificity</h3><div id="c3"></div></div>
      <div class="card"><h3>学习率（cosine 退火）</h3><div id="c4"></div></div>
    </div>`;
  setTimeout(()=>{
    lineChart($("#c1"),[toSeries("train_loss","train_loss","#f85149"),toSeries("val_loss","val_loss","#d29922")]);
    lineChart($("#c2"),[toSeries("dice","dice","#4f8cff"),toSeries("iou","iou","#39c5cf")]);
    lineChart($("#c3"),[toSeries("sensitivity","sensitivity","#3fb950"),toSeries("specificity","specificity","#bc8cff")]);
    lineChart($("#c4"),[toSeries("lr","lr","#d29922")],{h:180});
  },0);
  return h;
}

function vHistory(){
  const runs=[...STATE.runs].reverse();
  return `<div class="sec"><h2>🗂 全部历史运行（点击行查看详情）</h2><div class="card">${runTable(runs)}</div></div>
    <div class="sec"><h2>🏆 测试集评测档案</h2><div class="card">${evalTable(STATE.evals)}</div></div>`;
}

function vCode(){
  const files=STATE.code;
  return `<div class="sec"><h2>💻 核心代码（src/）</h2>
    <div style="display:grid;grid-template-columns:250px 1fr;gap:14px">
      <div class="card filelist" id="fl">${files.map(f=>`<a data-p="${f.path}" onclick="loadCode('${f.path}',this)">${f.path.replace("src/","")}</a>`).join("")}</div>
      <div class="card" style="padding:0"><div class="codebox" id="codeview"><p class="muted" style="padding:16px">← 选择文件查看（手写实现，含中文注释）</p></div></div>
    </div></div>`;
}
async function loadCode(p,el){
  document.querySelectorAll("#fl a").forEach(a=>a.classList.remove("on"));el.classList.add("on");
  const d=await (await fetch("/api/code?path="+encodeURIComponent(p))).json();
  $("#codeview").innerHTML=`<pre>${d.content.split("\n").map(l=>`<span>${esc(l)||" "}</span>`).join("")}</pre>`;
}

function vModels(){
  const ck=STATE.checkpoints,fg=STATE.figures;
  return `<div class="sec"><h2>⬇️ 模型权重下载（outputs/checkpoints/）</h2><div class="card">
    ${ck.length?`<table><thead><tr><th class="plain">文件</th><th>大小</th><th class="plain">修改时间</th><th class="plain">操作</th></tr></thead><tbody>`+
      ck.map(c=>`<tr><td>${c.name}</td><td>${c.size_h}</td><td class="plain muted">${c.mtime}</td>
        <td class="plain"><a class="btn" href="/download/?path=${encodeURIComponent(c.path)}">下载</a></td></tr>`).join("")+`</tbody></table>`
      :'<p class="muted">暂无 checkpoint（训练运行后自动生成）</p>'}</div></div>
    <div class="sec"><h2>🖼 图表产物（outputs/figures/）</h2>
    ${fg.length?`<div class="imgs">${fg.map(f=>`<figure><img src="/figures/${f.name}" loading="lazy"><figcaption>${f.name}</figcaption></figure>`).join("")}</div>`:'<div class="card"><p class="muted">暂无图表</p></div>'}</div>`;
}

function vReports(){
  const rp=STATE.reports.filter(r=>r.name.endsWith(".md"));
  return `<div class="sec"><h2>📄 报告文档（reports/）</h2>
    <div style="display:grid;grid-template-columns:250px 1fr;gap:14px">
      <div class="card filelist" id="rl">${rp.map(f=>`<a data-p="${f.path}" onclick="loadReport('${f.path}',this)">${f.name}</a>`).join("")||'<p class="muted">暂无</p>'}</div>
      <div class="card" id="repview"><p class="muted">← 选择报告查看</p></div>
    </div></div>`;
}
async function loadReport(p,el){
  document.querySelectorAll("#rl a").forEach(a=>a.classList.remove("on"));el.classList.add("on");
  const d=await (await fetch("/api/report?path="+encodeURIComponent(p))).json();
  $("#repview").innerHTML=md(d.content);
}

/* ================= 运行详情抽屉 ================= */
function openRun(tag){
  const r=STATE.runs.find(x=>x.tag===tag);if(!r)return;
  const d=$("#drawer");
  d.innerHTML=`<span class="close" onclick="closeDrawer()">✕</span>
    <h2 style="font-size:16px">${r.tag} ${statusTag(r)}</h2>
    <div class="kv">
      <b>模型</b><span>${r.model}</span><b>随机种子</b><span>${r.seed??"—"}</span>
      <b>进度</b><span>${r.epochs_done} / ${r.total_epochs||30} epoch</span>
      <b>最佳 dice</b><span class="ok">${fmt(r.best_val_dice)}</span>
      <b>累计时长</b><span>${fmt(r.cum_min,1)} min</span>
      <b>最近更新</b><span>${r.updated}</span>
    </div>
    <h3 style="font-size:13px;margin:14px 0 6px">训练配置</h3>
    <div class="codebox" style="max-height:180px"><pre>${esc(JSON.stringify(r.config,null,2)).split("\n").map(l=>`<span>${l}</span>`).join("")}</pre></div>
    <h3 style="font-size:13px;margin:14px 0 6px">曲线</h3>
    <div class="card"><h3>Dice / Loss</h3><div id="dc"></div></div>`;
  d.classList.add("open");
  setTimeout(()=>{const s=r.series;
    lineChart($("#dc"),[
      {name:"dice",color:"#4f8cff",data:s.map(row=>({x:row.epoch,y:row.dice}))},
      {name:"iou",color:"#39c5cf",data:s.map(row=>({x:row.epoch,y:row.iou}))}],{h:200});
  },30);
}
function closeDrawer(){$("#drawer").classList.remove("open")}

/* ================= 路由 & 轮询 ================= */
const VIEWS={overview:vOverview,monitor:vMonitor,history:vHistory,code:vCode,models:vModels,reports:vReports};
function render(){
  document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",a.dataset.v===VIEW));
  $("#view").innerHTML=VIEWS[VIEW]();
}
async function tick(){
  try{
    const s=await (await fetch("/api/state")).json();
    STATE=s;
    $("#ptitle").textContent=s.project.title;
    $("#psub").textContent=s.project.subtitle;
    $("#clock").textContent="服务端 "+s.server_time;
    render();
  }catch(e){$("#clock").textContent="连接中断，重试中…"}
}
document.querySelectorAll("nav a").forEach(a=>a.onclick=e=>{e.preventDefault();VIEW=a.dataset.v;location.hash=VIEW;render()});
window.addEventListener("hashchange",()=>{const v=location.hash.slice(1);if(VIEWS[v]){VIEW=v;render()}});
VIEW=location.hash.slice(1)||"overview";
tick();setInterval(tick,5000);
</script>
</body>
</html>
